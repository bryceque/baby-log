<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Activity Log">
<meta name="theme-color" content="#f5ead8">
<title>Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5ead8;--surface:#ebddc5;--surfaceLight:#fffdf9;
  --text:#201e1d;--muted:#82796a;--mutedLight:#a19786;
  --divider:rgba(32,30,29,.12);
  --accent:#c67139;--accent2:#7a8a5e;
  --diaper-bg:oklch(90% 0.035 55);--diaper-fg:oklch(34% 0.055 42);--diaper-accent:oklch(55% 0.07 48);
  --nurse-bg:var(--accent2-100,#f0fae1);--nurse-fg:#3d472b;--nurse-accent:#8fa073;
  --bottle-bg:oklch(90% 0.045 235);--bottle-fg:oklch(36% 0.08 235);--bottle-accent:oklch(64% 0.10 235);
  --pump-bg:oklch(92% 0.07 95);--pump-fg:oklch(42% 0.12 85);--pump-accent:oklch(65% 0.14 90);
  --radius:28px;--shadow:0 3px 10px rgba(46,43,37,.16);
  --font-h:'Caprasimo',system-ui,sans-serif;--font-b:'Figtree',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 16px 100px;max-width:480px;margin:0 auto}
button{font-family:var(--font-b);cursor:pointer;border:none;background:none;color:inherit}
input[type=number],input[type=datetime-local]{font-family:var(--font-b)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:400}

.header{text-align:center;padding:16px 0 14px}
.header h1{font-size:26px;margin:0}
.header .name{font-size:14px;color:var(--accent);font-weight:600;margin-top:4px}
.header .date{font-size:13px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.s-card{border-radius:var(--radius);padding:14px 10px;text-align:center}
.s-card .num{font-size:22px;font-weight:700;font-family:var(--font-h)}
.s-card .label{font-size:11px;color:var(--muted);margin-top:2px}
.s-card .sub{font-size:10px;color:var(--mutedLight);margin-top:3px;line-height:1.4}

.chart-wrap{background:#ffffffaa;border-radius:var(--radius);padding:16px 16px 12px;margin-bottom:18px;box-shadow:var(--shadow)}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;background:none;border:none;padding:0;cursor:pointer;font-family:var(--font-b)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.act-btn{padding:18px 6px;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px}

.form-card{background:var(--surfaceLight);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.form-header{display:flex;align-items:center;margin-bottom:18px}
.back-btn{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:14px;font-weight:600;padding:4px 0}
.form-title{flex:1;text-align:center;font-family:var(--font-h);font-size:16px;margin-right:56px}
.form-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}

.pill{padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;border:2px solid transparent}
.pill.on{border-color:currentColor}

.stepper{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:14px}
.stepper button{width:38px;height:40px;border-radius:12px;background:#eee7db;font-size:18px;color:var(--text);touch-action:manipulation}
.stepper .val{width:70px;text-align:center;padding:8px 4px;border-radius:12px;background:#fff;border:2px solid #dcd3c4;font-size:20px;font-weight:700;font-family:var(--font-h);-moz-appearance:textfield;touch-action:manipulation}
.stepper .unit{color:var(--muted);font-size:13px}
body *{touch-action:manipulation}

.quick{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.quick button{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted)}

.time-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:20px}
.time-row input{padding:8px 12px;border-radius:10px;border:1px solid #dcd3c4;background:#fff;color:var(--text);font-size:14px}

.btn-row{display:flex;gap:10px;justify-content:center}
.cancel-btn{padding:8px 16px;border-radius:999px;color:var(--accent);font-size:14px;font-family:var(--font-h)}
.save-btn{padding:12px 32px;border-radius:999px;font-size:15px;font-weight:700;color:#fff}

.history-title{margin:6px 0 12px 2px;font-size:14px;font-weight:700;color:var(--muted);font-family:var(--font-h)}
.entry{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;margin-bottom:8px;border-left:4px solid;user-select:none;-webkit-user-select:none;transition:transform .15s}
.entry.pressed{transform:scale(0.97)}
.entry .info{flex:1}
.entry .sum{font-size:14px;font-weight:600}
.entry .time{font-size:12px;color:var(--muted);margin-top:3px}
.entry .sync-tag{font-size:9px;padding:1px 6px;margin-left:6px;border:1px solid var(--accent);color:var(--accent);border-radius:999px}
.entry .spinner{width:18px;height:18px;border:2px solid var(--mutedLight);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

.ctx-menu{position:fixed;z-index:60;background:var(--surfaceLight);border-radius:16px;box-shadow:0 8px 32px rgba(32,30,29,.28);padding:6px;min-width:180px;overflow:hidden}
.ctx-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;width:100%;text-align:left}
.ctx-item:active{background:#eee7db}
.ctx-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.ctx-sep{height:1px;background:var(--divider);margin:2px 8px}
.ctx-overlay{position:fixed;inset:0;z-index:55;background:rgba(32,30,29,.3)}

.confirm-modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(32,30,29,.45)}
.confirm-box{background:var(--surfaceLight);border-radius:var(--radius);padding:24px 20px;max-width:300px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(32,30,29,.3)}
.confirm-box h3{font-family:var(--font-h);font-size:17px;margin-bottom:6px}
.confirm-box p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.4}
.confirm-btns{display:flex;gap:10px;justify-content:center}
.confirm-btns button{padding:10px 22px;border-radius:999px;font-size:14px;font-weight:700}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;background:#ffffff88;border-radius:var(--radius)}
.show-more{display:block;margin:8px auto;padding:8px 20px;border-radius:999px;color:var(--accent);font-size:14px;font-family:var(--font-h)}
.deleted-section{margin-top:24px;padding-top:16px;border-top:1px solid var(--divider)}
.deleted-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 2px;font-size:13px;font-weight:600;color:var(--mutedLight)}
.deleted-entry{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:#eee7db;opacity:.6}
.deleted-entry .info{flex:1}
.deleted-entry .sum{font-size:13px;font-weight:600;color:var(--muted)}
.deleted-entry .time{font-size:11px;color:var(--mutedLight);margin-top:2px}
.restore-btn{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent2);color:#fff;flex-shrink:0}

.modal-bg{position:fixed;inset:0;background:rgba(32,30,29,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:var(--surfaceLight);border-radius:var(--radius) var(--radius) 0 0;padding:22px 20px 28px;box-shadow:0 -12px 32px rgba(32,30,29,.22)}
.modal-title{font-family:var(--font-h);font-size:18px}
.modal-close{width:32px;height:32px;border-radius:999px;background:#eee7db;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyKhhzpzd7kcYYuWquEimol3DFPIiav44dwwH0RREujfyOO9-QWLGm6dIr84FjByrC6/exec";
const S={logs:JSON.parse(localStorage.getItem("bl-logs")||"[]"),form:null,syncing:false,confirmDel:null,showCount:5,pendingWrites:JSON.parse(localStorage.getItem("bl-pending")||"[]"),selectedDay:null,selectedRange:null,dayExpanded:false,ctxMenu:null,ctxX:0,ctxY:0,editId:null,editTime:null,editMins:null,editMl:null,editPump:null,recentlyDeleted:JSON.parse(localStorage.getItem("bl-deleted")||"[]"),showDeleted:false};
function save(){localStorage.setItem("bl-logs",JSON.stringify(S.logs))}
function savePending(){localStorage.setItem("bl-pending",JSON.stringify(S.pendingWrites))}
function toDate(d){return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`}
function toTime(d){const h=d.getHours(),m=d.getMinutes().toString().padStart(2,"0");return `${h%12||12}:${m} ${h>=12?"PM":"AM"}`}
function toISO(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function timeSince(ds,ts){if(!ts||!ds)return "";try{const tp=ts.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return "";let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;const dp=ds.split("/");if(dp.length!==3)return "";const d=new Date(+dp[2],+dp[0]-1,+dp[1],h,m);if(isNaN(d))return "";const mins=Math.floor((Date.now()-d)/60000);if(mins<0)return "";if(mins<1)return "just now";if(mins<60)return mins+"m ago";const hrs=Math.floor(mins/60);if(hrs<24)return hrs+"h "+(mins%60)+"m ago";return Math.floor(hrs/24)+"d ago";}catch{return "";}}
function shortTime(ds,ts){return ts&&ds?ts+" · "+timeSince(ds,ts):"";}
function classify(e){if(e.pee||e.poop)return "diaper";if(e.breastLength)return "breast";if(e.formulaAmount)return "formula";if(e.breastMilkAmount)return "breastmilk";if(e.pumpAmount)return "pump";return "other";}
function parseEntryDate(e){if(!e.date||!e.time)return 0;try{const tp=e.time.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return 0;let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;const dp=e.date.split("/");if(dp.length!==3)return 0;return new Date(+dp[2],+dp[0]-1,+dp[1],h,m).getTime();}catch{return 0;}}
function sortLogs(){S.logs.sort((a,b)=>parseEntryDate(b)-parseEntryDate(a));}
function dedupKey(e){
  // Normalize: strip spaces, lowercase, just core identity
  const d=(e.date||"").trim();
  const t=(e.time||"").replace(/\s+/g," ").trim();
  const tp=e.displayType||classify(e);
  return [d,t,tp].join("|");
}
function dedup(){
  // Keep first occurrence (newest by sort position), remove later dupes
  const seen=new Map();
  const keep=[];
  for(const e of S.logs){
    const k=dedupKey(e);
    if(!seen.has(k)){seen.set(k,e);keep.push(e);}
    else{
      // Keep the one that's synced/fromSheet over the local one
      const existing=seen.get(k);
      if(!existing.synced&&!existing.fromSheet&&(e.synced||e.fromSheet)){
        // Replace the kept one with this synced version
        const idx=keep.indexOf(existing);
        if(idx>=0){keep[idx]=e;seen.set(k,e);}
      }
      // Otherwise discard this duplicate
    }
  }
  S.logs=keep;
}
async function syncFromSheet(){S.syncing=true;render();try{const r=await fetch(SCRIPT_URL);if(!r.ok)throw 0;const data=await r.json();const sheetEntries=data.map(row=>{const e={date:row["Today's Date"]||"",time:row["Time of Day"]||"",breastLength:row["Length of Breast Feeding"]||"",formulaAmount:row["Formula Amount"]||"",breastMilkAmount:row["Breast Milk Amount"]||"",side:row["Right Side/Left Side"]||"",pee:row["Pee"]||"",poop:row["Poop"]||"",pumpAmount:row["Pump Amount"]||""};if(e.date.includes("1899"))e.date="";if(e.time.includes("1899"))e.time="";e.displayType=classify(e);return e;}).filter(e=>e.date||e.time);
// Mark local entries as synced if they match a sheet entry
const sheetKeys=new Map();
sheetEntries.forEach(se=>{const k=dedupKey(se);sheetKeys.set(k,(sheetKeys.get(k)||0)+1);});
const localOnly=S.logs.filter(l=>!l.fromSheet);
const matchedKeys=new Map();
localOnly.forEach(l=>{const k=dedupKey(l);const avail=(sheetKeys.get(k)||0)-(matchedKeys.get(k)||0);if(avail>0){l.synced=true;matchedKeys.set(k,(matchedKeys.get(k)||0)+1);}});
// Only add sheet entries that weren't matched to a local entry
const newFromSheet=[];
const usedCounts=new Map();
sheetEntries.forEach(se=>{const k=dedupKey(se);const localMatched=matchedKeys.get(k)||0;const usedSoFar=usedCounts.get(k)||0;if(usedSoFar<localMatched){usedCounts.set(k,usedSoFar+1);}else{newFromSheet.push({...se,fromSheet:true,synced:true,id:"s-"+Math.random().toString(36).slice(2,8)});}});
S.logs=[...localOnly,...newFromSheet];sortLogs();dedup();save();}catch(e){console.error("Sync:",e);}S.syncing=false;render();}
async function writeToSheet(entry){S.pendingWrites.push(entry);savePending();render();flushPending();}
async function flushPending(){while(S.pendingWrites.length>0){const entry=S.pendingWrites[0];try{const p=new URLSearchParams({action:"add",date:entry.date||"",timeOfDay:entry.time||"",breastLength:entry.breastLength||"",formulaAmount:entry.formulaAmount||"",breastMilkAmount:entry.breastMilkAmount||"",side:entry.side||"",pee:entry.pee||"",poop:entry.poop||"",pumpAmount:entry.pumpAmount||""});const r=await fetch(SCRIPT_URL+"?"+p.toString());if(r.ok){S.pendingWrites.shift();savePending();render();}else break;}catch{break;}}}
function addEntry(entry){entry.displayType=classify(entry);entry.id=Date.now().toString();S.logs.unshift(entry);sortLogs();save();S.form=null;render();writeToSheet(entry);}
function deleteEntry(id){
  const e=S.logs.find(l=>l.id===id);
  if(e){
    e.deletedAt=new Date().toISOString();
    S.recentlyDeleted.unshift(e);
    if(S.recentlyDeleted.length>20)S.recentlyDeleted=S.recentlyDeleted.slice(0,20);
    localStorage.setItem("bl-deleted",JSON.stringify(S.recentlyDeleted));
    // Delete from sheet
    deleteFromSheet(e);
  }
  S.logs=S.logs.filter(l=>l.id!==id);save();S.confirmDel=null;render();
}
async function deleteFromSheet(e){
  try{const p=new URLSearchParams({action:"delete",date:e.date||"",timeOfDay:e.time||""});
  await fetch(SCRIPT_URL+"?"+p.toString());}catch(err){console.error("Sheet delete:",err);}
}
function saveDeleted(){localStorage.setItem("bl-deleted",JSON.stringify(S.recentlyDeleted));}
function restoreEntry(idx){
  const e=S.recentlyDeleted.splice(idx,1)[0];if(!e)return;
  delete e.deletedAt;e.synced=false;e.fromSheet=false;e.id=Date.now().toString();
  S.logs.unshift(e);sortLogs();save();saveDeleted();
  writeToSheet(e);render();
}
function clearAllDeleted(){S.recentlyDeleted=[];saveDeleted();render();}

const EC={diaper:{accent:"var(--diaper-accent)",bg:"var(--diaper-bg)",fg:"var(--diaper-fg)"},breast:{accent:"var(--nurse-accent)",bg:"var(--nurse-bg)",fg:"var(--nurse-fg)"},formula:{accent:"var(--bottle-accent)",bg:"var(--bottle-bg)",fg:"var(--bottle-fg)"},breastmilk:{accent:"var(--bottle-accent)",bg:"var(--bottle-bg)",fg:"var(--bottle-fg)"},pump:{accent:"var(--pump-accent)",bg:"var(--pump-bg)",fg:"var(--pump-fg)"},other:{accent:"var(--mutedLight)",bg:"#eee7db",fg:"var(--muted)"}};
function sumText(e){if(e.displayType==="diaper"){const p=[];if(e.pee)p.push("💧 Pee");if(e.poop)p.push("💩 Poop");return p.join(" + ");}if(e.displayType==="breast")return `🤱 ${e.side||"?"} · ${e.breastLength}`;if(e.displayType==="formula")return `🍼 Formula · ${e.formulaAmount}`;if(e.displayType==="breastmilk")return `🍼 Breast Milk · ${e.breastMilkAmount}`;if(e.displayType==="pump")return `🥛 Pumped · ${e.pumpAmount}`;return "📝 Feeding";}

function renderSummary(){
  const today=toDate(new Date()),all=S.logs,t=all.filter(l=>l.date===today);
  const diapers=t.filter(l=>l.displayType==="diaper").length;
  const lastPee=all.filter(l=>l.pee).sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  const lastPoop=all.filter(l=>l.poop).sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  let dSub="";if(lastPee)dSub+=`<div class="sub">💧 ${shortTime(lastPee.date,lastPee.time)}</div>`;if(lastPoop)dSub+=`<div class="sub">💩 ${shortTime(lastPoop.date,lastPoop.time)}</div>`;
  const lastNurse=all.filter(l=>l.displayType==="breast").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  const nBig=lastNurse?(lastNurse.side||"?"):"—";let nSub="";if(lastNurse)nSub=`<div class="sub">${lastNurse.breastLength}</div><div class="sub">${shortTime(lastNurse.date,lastNurse.time)}</div>`;
  const bMl=t.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk").reduce((s,l)=>{const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
  const lastB=all.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  let bSub="";if(lastB){bSub=`<div class="sub">Last: ${lastB.formulaAmount||lastB.breastMilkAmount}</div><div class="sub">${shortTime(lastB.date,lastB.time)}</div>`;}
  const pMl=t.filter(l=>l.displayType==="pump").reduce((s,l)=>{const m=(l.pumpAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
  const lastP=all.filter(l=>l.displayType==="pump").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  let pSub="";if(lastP){pSub=`<div class="sub">Last: ${lastP.pumpAmount}</div><div class="sub">${shortTime(lastP.date,lastP.time)}</div>`;}
  return `<div class="summary">
    <div class="s-card" style="background:var(--diaper-bg)"><div class="num" style="color:var(--diaper-fg)">${diapers}</div><div class="label">diapers today</div>${dSub}</div>
    <div class="s-card" style="background:var(--nurse-bg)"><div class="num" style="color:var(--nurse-fg)">${nBig}</div><div class="label">last side</div>${nSub}</div>
    <div class="s-card" style="background:var(--bottle-bg)"><div class="num" style="color:var(--bottle-fg)">${(bMl/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">bottle today · ${bMl} mL</div>${bSub}</div>
    <div class="s-card" style="background:var(--pump-bg)"><div class="num" style="color:var(--pump-fg)">${(pMl/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">pumped today · ${pMl} mL</div>${pSub}</div>
  </div>`;
}

function renderChart(){
  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];const counts=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=toDate(d);counts.push({ds,count:S.logs.filter(l=>l.date===ds).length,isToday:i===0,dow:d.getDay()});}
  const mx=Math.max(1,...counts.map(c=>c.count));
  let bars="";counts.forEach(c=>{const sel=S.selectedDay===c.ds;const pct=c.count===0?4:Math.round((c.count/mx)*100);
    bars+=`<button class="chart-bar-wrap" onclick="openDay('${c.ds}')"><div style="width:100%;max-width:26px;border-radius:8px 8px 3px 3px;background:${sel?"var(--accent)":c.isToday?"#d67f48":"#f6a06b"};height:${pct}%;min-height:4px"></div><span style="font-size:9px;color:${sel?"var(--accent)":c.isToday?"#8c491a":"var(--mutedLight)"};font-weight:${c.isToday||sel?"700":"400"}">${dow[c.dow]}</span></button>`;});
  return `<div class="chart-wrap"><div style="display:flex;align-items:center;gap:6px;margin-bottom:12px"><span style="font-size:13px;font-weight:600;flex:1">Last 7 days</span><button onclick="openYesterday()" style="padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted);border:none;cursor:pointer">Yesterday</button><button onclick="openLast12h()" style="padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted);border:none;cursor:pointer">Last 12 hrs</button></div><div style="display:flex;align-items:flex-end;gap:8px;height:70px">${bars}</div></div>`;
}

function renderEntry(e,i){const c=EC[e.displayType]||EC.other;const since=timeSince(e.date,e.time);const isSynced=e.synced||e.fromSheet;const isResyncing=e.resyncing;
  let statusIcon="";let opacity="1";
  if(isResyncing){statusIcon='<div class="spinner"></div>';opacity="0.45";}
  else if(isSynced){statusIcon='<span style="color:var(--accent2);font-size:13px" title="Synced">✓</span>';}
  else{statusIcon='<span style="color:var(--mutedLight);font-size:10px">⏳</span>';opacity="0.45";}
  const syncMark=isSynced&&!isResyncing?'<span style="margin-left:6px;color:var(--accent2);font-size:13px">✓</span>':'';
  const pendMark=!isSynced&&!isResyncing?'<span style="margin-left:6px;color:var(--mutedLight);font-size:10px">⏳</span>':'';
  return `<div class="entry" style="background:${c.bg};border-color:${c.accent};opacity:${opacity}" ontouchstart="lpStart('${e.id}',event)" ontouchend="lpEnd()" ontouchcancel="lpEnd()" oncontextmenu="lpFire('${e.id}',event);return false"><div class="info"><div class="sum">${sumText(e)}${syncMark}${pendMark}</div><div class="time">${e.date} ${e.time}${since?" · "+since:""}</div></div>${statusIcon}</div>`;}

let lpTimer=null,lpId=null;
function lpStart(id,ev){lpId=id;lpTimer=setTimeout(()=>{lpFire(id,ev);},500);}
function lpEnd(){clearTimeout(lpTimer);lpTimer=null;}
function lpFire(id,ev){clearTimeout(lpTimer);ev.preventDefault();S.ctxMenu=id;
  const t=ev.touches?ev.touches[0]:ev;S.ctxX=Math.min(t.clientX,window.innerWidth-200);S.ctxY=Math.min(t.clientY,window.innerHeight-180);render();}

function editEntry(id){S.ctxMenu=null;const e=S.logs.find(l=>l.id===id);if(!e)return;
  S.editId=id;
  if(e.displayType==="diaper"){S.form="diaper";formPee=!!e.pee;formPoop=!!e.poop;S.editTime=parseEditTime(e);}
  else if(e.displayType==="breast"){S.form="breast";formSide=e.side||"Left";S.editMins=parseInt(e.breastLength)||15;S.editTime=parseEditTime(e);}
  else if(e.displayType==="formula"||e.displayType==="breastmilk"){S.form="bottle";formBottleType=e.displayType==="formula"?"formula":"breastmilk";S.editMl=parseInt(e.formulaAmount||e.breastMilkAmount)||4;S.editTime=parseEditTime(e);}
  else if(e.displayType==="pump"){S.form="pump";S.editPump=parseInt(e.pumpAmount)||12;S.editTime=parseEditTime(e);}
  render();
}
function parseEditTime(e){try{const tp=e.time.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return toISO(new Date());let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;const dp=e.date.split("/");const d=new Date(+dp[2],+dp[0]-1,+dp[1],h,m);return toISO(d);}catch{return toISO(new Date());}}

async function resyncEntry(id){S.ctxMenu=null;const e=S.logs.find(l=>l.id===id);if(!e)return;
  e.resyncing=true;render();
  try{
    const r=await fetch(SCRIPT_URL);
    if(!r.ok)throw new Error("fetch failed");
    const data=await r.json();
    const sheetEntries=data.map(row=>{
      const s={date:row["Today's Date"]||"",time:row["Time of Day"]||"",breastLength:row["Length of Breast Feeding"]||"",formulaAmount:row["Formula Amount"]||"",breastMilkAmount:row["Breast Milk Amount"]||"",side:row["Right Side/Left Side"]||"",pee:row["Pee"]||"",poop:row["Poop"]||"",pumpAmount:row["Pump Amount"]||""};
      if(s.date.includes("1899"))s.date="";if(s.time.includes("1899"))s.time="";s.displayType=classify(s);return s;
    });
    const myKey=dedupKey(e);
    const found=sheetEntries.some(s=>dedupKey(s)===myKey);
    if(found){e.synced=true;}
    else{
      const p=new URLSearchParams({action:"add",date:e.date||"",timeOfDay:e.time||"",breastLength:e.breastLength||"",formulaAmount:e.formulaAmount||"",breastMilkAmount:e.breastMilkAmount||"",side:e.side||"",pee:e.pee||"",poop:e.poop||"",pumpAmount:e.pumpAmount||""});
      const wr=await fetch(SCRIPT_URL+"?"+p.toString());
      if(wr.ok){e.synced=true;}
    }
  }catch(err){console.error("Resync:",err);}
  e.resyncing=false;dedup();save();render();}

function renderForm(){const iso=S.editTime||toISO(new Date());const isEdit=!!S.editId;const editLabel=isEdit?"Update":"Save";

  if(S.form==="bottle"){const ml=S.editMl||24;const isBM=formBottleType==="breastmilk";return `<div class="form-card"><div class="form-header"><button class="back-btn" onclick="cancelForm()">‹ Back</button><div class="form-title" style="color:var(--bottle-fg)">${isEdit?"Edit ":""}Bottle</div></div><div class="form-row"><button class="pill${isBM?" on":""}" id="bm-btn" onclick="pickBottle('breastmilk')" style="color:${isBM?"var(--bottle-fg)":"var(--muted)"};border-color:${isBM?"var(--bottle-accent)":"transparent"};background:${isBM?"var(--bottle-bg)":"#eee7db"}">Breast Milk</button><button class="pill${!isBM?" on":""}" id="formula-btn" onclick="pickBottle('formula')" style="color:${!isBM?"var(--bottle-fg)":"var(--muted)"};border-color:${!isBM?"var(--bottle-accent)":"transparent"};background:${!isBM?"var(--bottle-bg)":"#eee7db"}">Formula</button></div><div class="stepper"><button onclick="stepMl(-5)">−5</button><button onclick="stepMl(-1)">−</button><input type="number" class="val" id="f-ml" value="${ml}" onchange="clampMl()" inputmode="numeric"><span class="unit">mL</span><button onclick="stepMl(1)">+</button><button onclick="stepMl(5)">+5</button></div><div class="quick"><button onclick="setMl(20)">20mL</button><button onclick="setMl(12)">12mL</button><button onclick="setMl(30)">30mL</button></div><div class="time-row"><input type="datetime-local" id="f-time" value="${iso}"></div><div class="btn-row"><button class="cancel-btn" onclick="cancelForm()">Cancel</button><button class="save-btn" id="bottle-save" style="background:var(--bottle-accent)" onclick="saveBottle()">${editLabel}</button></div></div>`;}
  if(S.form==="pump"){const ml=S.editPump||12;return `<div class="form-card"><div class="form-header"><button class="back-btn" onclick="cancelForm()">‹ Back</button><div class="form-title" style="color:var(--pump-fg)">${isEdit?"Edit ":""}Pump</div></div><div class="stepper"><button onclick="stepPump(-5)">−5</button><button onclick="stepPump(-1)">−</button><input type="number" class="val" id="f-pump" value="${ml}" onchange="clampPump()" inputmode="numeric"><span class="unit">mL</span><button onclick="stepPump(1)">+</button><button onclick="stepPump(5)">+5</button></div><div class="quick"><button onclick="setPump(8)">8mL</button><button onclick="setPump(10)">10mL</button><button onclick="setPump(16)">16mL</button></div><div class="time-row"><input type="datetime-local" id="f-time" value="${iso}"></div><div class="btn-row"><button class="cancel-btn" onclick="cancelForm()">Cancel</button><button class="save-btn" style="background:var(--pump-accent)" onclick="savePump()">${editLabel}</button></div></div>`;}

function cancelForm(){S.form=null;S.editId=null;S.editTime=null;S.editMins=null;S.editMl=null;S.editPump=null;formPee=false;formPoop=false;formSide="Left";formBottleType="breastmilk";render();}

function renderDayModal(){
  if(!S.selectedDay&&!S.selectedRange)return "";
  let dayLogs,title;
  if(S.selectedRange==="12h"){
    const cutoff=Date.now()-12*3600000;
    dayLogs=S.logs.filter(l=>{const t=parseEntryDate(l);return t>=cutoff&&t<=Date.now();}).sort((a,b)=>parseEntryDate(a)-parseEntryDate(b));
    title="Last 12 Hours";
  }else{
    const ds=S.selectedDay;
    dayLogs=S.logs.filter(l=>l.date===ds).sort((a,b)=>parseEntryDate(a)-parseEntryDate(b));
    const [mm,dd,yy]=ds.split("/");title=new Date(+yy,+mm-1,+dd).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  }
  const diapers=dayLogs.filter(l=>l.displayType==="diaper").length;
  const wet=dayLogs.filter(l=>l.pee).length;const dirty=dayLogs.filter(l=>l.poop).length;
  const nurseEntries=dayLogs.filter(l=>l.displayType==="breast");
  const nurseMin=nurseEntries.reduce((s,l)=>s+(parseInt(l.breastLength)||0),0);
  const bottleEntries=dayLogs.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk");
  const bottleMl=bottleEntries.reduce((s,l)=>{const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
  const pumpEntries=dayLogs.filter(l=>l.displayType==="pump");
  const pumpMl=pumpEntries.reduce((s,l)=>{const m=(l.pumpAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
  let stats=`<div class="summary">
    <div class="s-card" style="background:var(--diaper-bg)"><div class="num" style="color:var(--diaper-fg)">${diapers}</div><div class="label">diapers (${wet}💧 ${dirty}💩)</div></div>
    <div class="s-card" style="background:var(--nurse-bg)"><div class="num" style="color:var(--nurse-fg)">${nurseMin}<span style="font-size:11px">min</span></div><div class="label">${nurseEntries.length} sessions</div></div>
    <div class="s-card" style="background:var(--bottle-bg)"><div class="num" style="color:var(--bottle-fg)">${(bottleMl/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">${bottleEntries.length} feeds · ${bottleMl} mL</div></div>
    <div class="s-card" style="background:var(--pump-bg)"><div class="num" style="color:var(--pump-fg)">${(pumpMl/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">${pumpEntries.length} sessions · ${pumpMl} mL</div></div>
  </div>`;
  let entries="";
  const reversed=dayLogs.slice().reverse();
  if(S.dayExpanded){
    reversed.forEach(e=>{const c=EC[e.displayType]||EC.other;entries+=`<div class="entry" style="background:${c.bg};border-color:${c.accent}"><div class="info"><div class="sum" style="font-size:13px">${sumText(e)}</div></div><div style="font-size:11px;color:var(--muted)">${e.time}</div></div>`;});
  }
  const chevron=S.dayExpanded?"▴":"▾";
  const historyBtn=dayLogs.length>0?`<button onclick="toggleDayExpand()" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--divider);font-size:14px;font-weight:600;color:var(--text);background:none;border-bottom:none;border-left:none;border-right:none;cursor:pointer">Full history (${dayLogs.length})<span>${chevron}</span></button>`:"<div style='text-align:center;padding:20px;color:var(--muted);font-size:13px'>No activity logged</div>";
  return `<div class="modal-bg" onclick="closeDay()"><div class="modal" onclick="event.stopPropagation()"><div style="display:flex;align-items:center;margin-bottom:16px"><div class="modal-title" style="flex:1">${title}</div><button class="modal-close" onclick="closeDay()">✕</button></div>${stats}${historyBtn}${entries}</div></div>`;
}

function renderDeletedSection(){
  const chevron=S.showDeleted?"▴":"▾";
  let h=`<div class="deleted-section"><button class="deleted-toggle" onclick="S.showDeleted=!S.showDeleted;render()">🗑️ Recently Deleted (${S.recentlyDeleted.length})<span>${chevron}</span></button>`;
  if(S.showDeleted){

      e.displayType=e.displayType||classify(e);
      const ago=timeSince(e.date,e.time);

    });
    h+=`<button onclick="clearAllDeleted()" style="display:block;margin:8px auto;padding:6px 16px;border-radius:999px;font-size:12px;color:#c0392b;background:none;border:1px solid #c0392b">Clear all</button>`;

function render(){
  const syncLabel=S.syncing?"Syncing...":S.pendingWrites.length>0?`${S.pendingWrites.length} pending`:"Synced";
  const syncBg=S.syncing?"#ffe1d0":"#eee7db";const syncColor=S.syncing?"#8c491a":"var(--muted)";
  let h=`<div class="header"><h1>Activity Log</h1><div class="name">Alaiya Maeve Querubin</div><div class="date">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div><span class="badge" style="background:${syncBg};color:${syncColor}">${syncLabel}</span></div>`;
  if(S.logs.length>0){h+=renderSummary();h+=renderChart();}
  if(!S.form){h+=`<div class="actions">
    <button class="act-btn" style="background:var(--diaper-bg);color:var(--diaper-fg)" onclick="S.form='diaper';render()"><span style="font-size:26px">🧷</span>Diaper</button>
    <button class="act-btn" style="background:var(--nurse-bg);color:var(--nurse-fg)" onclick="S.form='breast';render()"><span style="font-size:26px">🤱</span>Nurse</button>
    <button class="act-btn" style="background:var(--bottle-bg);color:var(--bottle-fg)" onclick="S.form='bottle';render()"><span style="font-size:26px">🍼</span>Bottle</button>
    <button class="act-btn" style="background:var(--pump-bg);color:var(--pump-fg)" onclick="S.form='pump';render()"><span style="font-size:26px">🥛</span>Pump</button>
  </div>`;}else{h+=renderForm();}
  h+=`<div class="history-title">History (${S.logs.length})</div>`;
  if(S.logs.length===0&&!S.syncing)h+=`<div class="empty">No logs yet — tap a button above to start</div>`;
  else{S.logs.slice(0,S.showCount).forEach((e,i)=>{h+=renderEntry(e,i);});if(S.logs.length>S.showCount)h+=`<button class="show-more" onclick="showMore()">Show more (${S.logs.length-S.showCount} older)</button>`;}
  if(S.recentlyDeleted.length>0){h+=renderDeletedSection();}
  h+=renderDayModal();
  h+=renderCtxMenu();
  h+=renderConfirmModal();
  document.getElementById("app").innerHTML=h;
}

let formPee=false,formPoop=false,formSide="Left",formBottleType="breastmilk";

function stepMin(d){const el=document.getElementById("f-mins");el.value=Math.max(1,Math.min(120,(+el.value||0)+d));}

function setMin(v){document.getElementById("f-mins").value=v;}

function showMore(){S.showCount+=10;render();}
function openDay(ds){S.selectedDay=ds;S.selectedRange=null;S.dayExpanded=false;render();}
function openYesterday(){const d=new Date();d.setDate(d.getDate()-1);S.selectedDay=toDate(d);S.selectedRange=null;S.dayExpanded=false;render();}
function openLast12h(){S.selectedDay=null;S.selectedRange="12h";S.dayExpanded=false;render();}
function closeDay(){S.selectedDay=null;S.selectedRange=null;render();}
function toggleDayExpand(){S.dayExpanded=!S.dayExpanded;render();}
function saveDiaper(){if(!formPee&&!formPoop)return;const d=new Date(document.getElementById("f-time").value);if(S.editId){S.logs=S.logs.filter(l=>l.id!==S.editId);}addEntry({date:toDate(d),time:toTime(d),pee:formPee?"X":"",poop:formPoop?"X":""});formPee=false;formPoop=false;S.editId=null;S.editTime=null;}
function saveBreast(){const mins=document.getElementById("f-mins").value;const d=new Date(document.getElementById("f-time").value);if(S.editId){S.logs=S.logs.filter(l=>l.id!==S.editId);}addEntry({date:toDate(d),time:toTime(d),breastLength:mins+" min",side:formSide});formSide="Left";S.editId=null;S.editTime=null;S.editMins=null;}
function saveBottle(){const ml=document.getElementById("f-ml").value;const d=new Date(document.getElementById("f-time").value);if(S.editId){S.logs=S.logs.filter(l=>l.id!==S.editId);}addEntry({date:toDate(d),time:toTime(d),formulaAmount:formBottleType==="formula"?ml+" mL":"",breastMilkAmount:formBottleType==="breastmilk"?ml+" mL":""});formBottleType="breastmilk";S.editId=null;S.editTime=null;S.editMl=null;}
function savePump(){const ml=document.getElementById("f-pump").value;const d=new Date(document.getElementById("f-time").value);if(S.editId){S.logs=S.logs.filter(l=>l.id!==S.editId);}addEntry({date:toDate(d),time:toTime(d),pumpAmount:ml+" mL"});S.editId=null;S.editTime=null;S.editPump=null;}
render();syncFromSheet();if(S.pendingWrites.length>0)flushPending();
</script>
</body>
</html>
