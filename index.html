<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Activity Log">
<meta name="theme-color" content="#f5ead8">
<title>Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f5ead8;--surface:#ebddc5;--surfaceLight:#fffdf9;
--text:#201e1d;--muted:#82796a;--mutedLight:#a19786;
--divider:rgba(32,30,29,.12);
--accent:#c67139;--accent2:#7a8a5e;
--green:#5a9a5a;--yellow:#d4952b;--red:#c44a3f;
--diaper-bg:oklch(90% 0.035 55);--diaper-fg:oklch(34% 0.055 42);--diaper-accent:oklch(55% 0.07 48);
--nurse-bg:#f0fae1;--nurse-fg:#3d472b;--nurse-accent:#8fa073;
--bottle-bg:oklch(90% 0.045 235);--bottle-fg:oklch(36% 0.08 235);--bottle-accent:oklch(64% 0.10 235);
--pump-bg:oklch(92% 0.07 95);--pump-fg:oklch(42% 0.12 85);--pump-accent:oklch(65% 0.14 90);
--radius:28px;--shadow:0 3px 10px rgba(46,43,37,.16);
--font-h:'Caprasimo',system-ui,sans-serif;--font-b:'Figtree',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100dvh;padding:env(safe-area-inset-top) 16px 100px;max-width:480px;margin:0 auto}
body *{touch-action:manipulation}
button{font-family:var(--font-b);cursor:pointer;border:none;background:none;color:inherit}
input[type=number],input[type=datetime-local],input[type=date]{font-family:var(--font-b)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:400}
.header{text-align:center;padding:16px 0 8px;position:relative}
.header h1{font-size:26px}
.header .name{font-size:14px;color:var(--accent);font-weight:600;margin-top:4px}
.header .date{font-size:13px;color:var(--muted);margin-top:4px}
.header .age{font-size:11px;color:var(--mutedLight);margin-top:2px}
.badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px}
.call-btn{position:absolute;right:4px;top:16px;width:36px;height:36px;border-radius:50%;background:#eee7db;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.feed-timer{text-align:center;padding:10px;margin-bottom:14px;border-radius:16px;background:#ffffff88;font-size:14px;font-weight:600}
.feed-timer .time-val{font-family:var(--font-h);font-size:18px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.feed-timer.warn{color:var(--yellow)}.feed-timer.danger{color:var(--red);animation:pulse 2s infinite}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.s-card{border-radius:var(--radius);position:relative;overflow:hidden}
.s-card-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1}
.s-card-scroll::-webkit-scrollbar{display:none}
.s-card-slide{min-width:100%;scroll-snap-align:start;padding:14px 10px;text-align:center;flex-shrink:0}
.s-card .num{font-size:22px;font-weight:700;font-family:var(--font-h)}
.s-card .label{font-size:11px;color:var(--muted);margin-top:2px}
.s-card .sub{font-size:10px;color:var(--mutedLight);margin-top:3px;line-height:1.4}
.progress-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.progress-slide .p-label{font-size:11px;font-weight:600;color:var(--muted)}
.progress-slide .p-target{font-size:10px;color:var(--mutedLight)}
.progress-bar{width:80%;height:10px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:5px;transition:width .3s}
.progress-num{font-family:var(--font-h);font-size:20px;font-weight:700}
.dots{display:flex;gap:4px;justify-content:center;position:absolute;bottom:6px;left:0;right:0}
.dots span{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.15)}
.dots span.active{background:rgba(0,0,0,.4)}
.status-dot{position:absolute;top:10px;right:10px;width:11px;height:11px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.6);z-index:5;padding:0;min-width:22px;min-height:22px;display:flex;align-items:center;justify-content:center;background-clip:padding-box}
.status-dot::after{content:"";width:11px;height:11px;border-radius:50%}
.status-dot.green::after{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.yellow::after{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.status-dot.red::after{background:var(--red);box-shadow:0 0 6px var(--red)}
.chart-wrap{background:#ffffffaa;border-radius:var(--radius);padding:16px 16px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;background:none;border:none;padding:0;cursor:pointer;font-family:var(--font-b)}
.milestones{background:#ffffffaa;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.milestone-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:13px;font-weight:700;color:var(--text)}
.m-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--divider);font-size:13px;line-height:1.4}
.m-check{width:20px;height:20px;border-radius:6px;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.m-check.done{background:var(--green);border-color:var(--green);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.act-btn{padding:18px 6px;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px}
.form-card{background:var(--surfaceLight);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.form-header{display:flex;align-items:center;margin-bottom:18px}
.back-btn{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:14px;font-weight:600;padding:4px 0}
.form-title{flex:1;text-align:center;font-family:var(--font-h);font-size:16px;margin-right:56px}
.form-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.pill{padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;border:2px solid transparent}
.pill.on{border-color:currentColor}
.stepper{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:14px}
.stepper button{width:38px;height:40px;border-radius:12px;background:#eee7db;font-size:18px;color:var(--text);touch-action:manipulation}
.stepper .val{width:70px;text-align:center;padding:8px 4px;border-radius:12px;background:#fff;border:2px solid #dcd3c4;font-size:20px;font-weight:700;font-family:var(--font-h);-moz-appearance:textfield}
.stepper .unit{color:var(--muted);font-size:13px}
.quick{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.quick button{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted)}
.time-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:20px}
.time-row input{padding:8px 12px;border-radius:10px;border:1px solid #dcd3c4;background:#fff;color:var(--text);font-size:14px}
.btn-row{display:flex;gap:10px;justify-content:center}
.cancel-btn{padding:8px 16px;border-radius:999px;color:var(--accent);font-size:14px;font-family:var(--font-h)}
.save-btn{padding:12px 32px;border-radius:999px;font-size:15px;font-weight:700;color:#fff}
.stool-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.stool-dot{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.stool-dot.on{border-color:var(--text);transform:scale(1.15)}
.history-title{margin:6px 0 12px 2px;font-size:14px;font-weight:700;color:var(--muted);font-family:var(--font-h)}
.entry{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;margin-bottom:8px;border-left:4px solid;user-select:none;-webkit-user-select:none;transition:transform .15s}
.entry .info{flex:1}.entry .sum{font-size:14px;font-weight:600}.entry .time{font-size:12px;color:var(--muted);margin-top:3px}
.entry .spinner{width:18px;height:18px;border:2px solid var(--mutedLight);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.show-more{display:block;margin:8px auto;padding:8px 20px;border-radius:999px;color:var(--accent);font-size:14px;font-family:var(--font-h)}
.deleted-section{margin-top:24px;padding-top:16px;border-top:1px solid var(--divider)}
.deleted-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 2px;font-size:13px;font-weight:600;color:var(--mutedLight)}
.deleted-entry{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:#eee7db;opacity:.6}
.deleted-entry .info{flex:1}.deleted-entry .sum{font-size:13px;font-weight:600;color:var(--muted)}.deleted-entry .time{font-size:11px;color:var(--mutedLight);margin-top:2px}
.restore-btn{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent2);color:#fff;flex-shrink:0}
.storage-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:6px;background:var(--pump-bg);font-size:12px}
.storage-card .s-info{flex:1}.storage-card .s-time{font-family:var(--font-h);font-size:14px}
.ctx-menu{position:fixed;z-index:60;background:var(--surfaceLight);border-radius:16px;box-shadow:0 8px 32px rgba(32,30,29,.28);padding:6px;min-width:180px}
.ctx-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;width:100%;text-align:left}
.ctx-item:active{background:#eee7db}
.ctx-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.ctx-sep{height:1px;background:var(--divider);margin:2px 8px}
.ctx-overlay{position:fixed;inset:0;z-index:55;background:rgba(32,30,29,.3)}
.confirm-modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(32,30,29,.45)}
.confirm-box{background:var(--surfaceLight);border-radius:var(--radius);padding:24px 20px;max-width:300px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(32,30,29,.3)}
.confirm-box h3{font-family:var(--font-h);font-size:17px;margin-bottom:6px}
.confirm-box p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.4}
.confirm-btns{display:flex;gap:10px;justify-content:center}
.confirm-btns button{padding:10px 22px;border-radius:999px;font-size:14px;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(32,30,29,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:480px;max-height:85vh;min-height:80vh;overflow-y:auto;background:var(--surfaceLight);border-radius:var(--radius) var(--radius) 0 0;padding:22px 20px 28px;box-shadow:0 -12px 32px rgba(32,30,29,.22)}
.modal-title{font-family:var(--font-h);font-size:18px}
.modal-close{width:32px;height:32px;border-radius:999px;background:#eee7db;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.status-panel{padding:16px;border-radius:16px;margin-bottom:12px}
.status-panel h4{font-size:15px;margin-bottom:8px}
.status-panel p{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:6px}
.status-panel .guideline{font-size:12px;font-style:italic;color:var(--mutedLight);border-left:3px solid;padding-left:10px;margin:10px 0}
.status-panel .action{font-size:13px;font-weight:600;margin-top:8px}
.call-ref h4{font-size:14px;font-family:var(--font-h);margin:14px 0 8px;color:var(--text)}
.call-ref ul{padding-left:18px;margin-bottom:8px}
.call-ref li{font-size:12px;line-height:1.5;color:var(--muted);margin-bottom:4px}
.call-ref .emergency{color:var(--red);font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;background:#ffffff88;border-radius:var(--radius)}
.setup-modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(32,30,29,.6)}
.setup-box{background:var(--surfaceLight);border-radius:var(--radius);padding:28px 24px;max-width:320px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(32,30,29,.3)}
.setup-box h2{font-family:var(--font-h);font-size:20px;margin-bottom:6px}
.setup-box p{font-size:13px;color:var(--muted);margin-bottom:16px}
.setup-box input{padding:10px 14px;border-radius:12px;border:2px solid #dcd3c4;background:#fff;font-size:16px;width:100%;text-align:center;margin-bottom:16px}
.setup-box button{padding:12px 32px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;background:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyKhhzpzd7kcYYuWquEimol3DFPIiav44dwwH0RREujfyOO9-QWLGm6dIr84FjByrC6/exec";
const S={logs:JSON.parse(localStorage.getItem("bl-logs")||"[]"),form:null,syncing:false,confirmDel:null,showCount:5,pendingWrites:JSON.parse(localStorage.getItem("bl-pending")||"[]"),selectedDay:null,selectedRange:null,dayExpanded:false,ctxMenu:null,ctxX:0,ctxY:0,editId:null,editTime:null,editMins:null,editMl:null,editPump:null,recentlyDeleted:JSON.parse(localStorage.getItem("bl-deleted")||"[]"),showDeleted:false,statusModal:null,callRef:false,showMilestones:true,storageTimers:JSON.parse(localStorage.getItem("bl-storage")||"[]")};
// Birth date
function getBirthDate(){return localStorage.getItem("babyBirthDate")}
function setBirthDate(d){localStorage.setItem("babyBirthDate",d)}
function babyAgeDays(){const b=getBirthDate();if(!b)return 0;const bd=new Date(b+"T00:00:00");const now=new Date();return Math.max(0,Math.floor((now-bd)/86400000));}
// Utils
function save(){localStorage.setItem("bl-logs",JSON.stringify(S.logs))}
function savePending(){localStorage.setItem("bl-pending",JSON.stringify(S.pendingWrites))}
function saveStorage(){localStorage.setItem("bl-storage",JSON.stringify(S.storageTimers))}
function toDate(d){return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`}
function toTime(d){const h=d.getHours(),m=d.getMinutes().toString().padStart(2,"0");return `${h%12||12}:${m} ${h>=12?"PM":"AM"}`}
function toISO(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function timeSince(ds,ts){if(!ts||!ds)return "";try{const tp=ts.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return "";let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;const dp=ds.split("/");const d=new Date(+dp[2],+dp[0]-1,+dp[1],h,m);if(isNaN(d))return "";const mins=Math.floor((Date.now()-d)/60000);if(mins<0)return "";if(mins<1)return "just now";if(mins<60)return mins+"m ago";const hrs=Math.floor(mins/60);if(hrs<24)return hrs+"h "+(mins%60)+"m ago";return Math.floor(hrs/24)+"d ago";}catch{return "";}}
function parseEntryDate(e){if(!e.date||!e.time)return 0;try{const tp=e.time.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return 0;let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;const dp=e.date.split("/");return new Date(+dp[2],+dp[0]-1,+dp[1],h,m).getTime();}catch{return 0;}}
function sortLogs(){S.logs.sort((a,b)=>parseEntryDate(b)-parseEntryDate(a));}
function classify(e){if(e.pee||e.poop)return "diaper";if(e.breastLength)return "breast";if(e.formulaAmount)return "formula";if(e.breastMilkAmount)return "breastmilk";if(e.pumpAmount)return "pump";return "other";}
const EC={diaper:{accent:"var(--diaper-accent)",bg:"var(--diaper-bg)",fg:"var(--diaper-fg)"},breast:{accent:"var(--nurse-accent)",bg:"var(--nurse-bg)",fg:"var(--nurse-fg)"},formula:{accent:"var(--bottle-accent)",bg:"var(--bottle-bg)",fg:"var(--bottle-fg)"},breastmilk:{accent:"var(--bottle-accent)",bg:"var(--bottle-bg)",fg:"var(--bottle-fg)"},pump:{accent:"var(--pump-accent)",bg:"var(--pump-bg)",fg:"var(--pump-fg)"},other:{accent:"var(--mutedLight)",bg:"#eee7db",fg:"var(--muted)"}};
function sumText(e){if(e.displayType==="diaper"){const p=[];if(e.pee)p.push("💧 Pee");if(e.poop)p.push("💩 Poop");let t=p.join(" + ");const sc=e.stoolColor||(e.poop&&e.poop.includes(" - ")?e.poop.split(" - ")[1]:"");if(sc)t+=" ("+sc+")";return t;}if(e.displayType==="breast")return `🤱 ${e.side||"?"} · ${e.breastLength}`;if(e.displayType==="formula")return `🍼 Formula · ${e.formulaAmount}`;if(e.displayType==="breastmilk")return `🍼 Breast Milk · ${e.breastMilkAmount}`;if(e.displayType==="pump")return `🥛 Pumped · ${e.pumpAmount}`;return "📝 Entry";}
function dedupKey(e){return [(e.date||"").trim(),(e.time||"").replace(/\s+/g," ").trim(),e.displayType||classify(e)].join("|");}
function dedup(){const seen=new Map(),keep=[];for(const e of S.logs){const k=dedupKey(e);if(!seen.has(k)){seen.set(k,e);keep.push(e);}else{const ex=seen.get(k);if(!ex.synced&&!ex.fromSheet&&(e.synced||e.fromSheet)){const i=keep.indexOf(ex);if(i>=0){keep[i]=e;seen.set(k,e);}}}}S.logs=keep;}
// Status logic
function getStatus(type){
  const today=toDate(new Date()),age=babyAgeDays(),now=new Date(),hr=now.getHours();
  const all=S.logs,todayLogs=all.filter(l=>l.date===today);
  if(type==="diaper"){
    const wet=todayLogs.filter(l=>l.pee).length;
    const target=Math.min(Math.max(age,1),6);
    let reason="",guideline=`Kaiser: at least ${target} wet diaper${target>1?"s":""} on day ${age}`,action="";
    if(wet>=target+1)return {color:"green",label:"On Track",reason:`${wet} wet diapers today — above target`,guideline,action:""};
    if(wet>=target)return {color:wet===target?"yellow":"green",label:wet===target?"Borderline":"On Track",reason:`${wet} wet diaper${wet>1?"s":""} today — ${wet===target?"exactly at":"meets"} minimum`,guideline,action:wet===target?"Keep feeding regularly and monitor":""}; 
    if(hr>=18)return {color:"red",label:"Needs Attention",reason:`Only ${wet} wet diaper${wet!==1?"s":""} today and it's evening — below the ${target} target`,guideline,action:"Consider calling your baby's doctor if count doesn't improve"};
    if(wet===0&&hr>=12)return {color:"red",label:"Needs Attention",reason:"No wet diapers by midday",guideline,action:"Call your baby's doctor"};
    return {color:"yellow",label:"Monitor",reason:`${wet} wet diaper${wet!==1?"s":""} so far — target is ${target}, still time today`,guideline,action:"Feed frequently and monitor"};
  }
  if(type==="nurse"){
    const cutoff=Date.now()-24*3600000;
    const sessions=all.filter(l=>l.displayType==="breast"&&parseEntryDate(l)>=cutoff);
    const ct=sessions.length;
    const lastNurse=all.filter(l=>l.displayType==="breast").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
    const lastMs=lastNurse?Date.now()-parseEntryDate(lastNurse):Infinity;
    const lastHrs=lastMs/3600000;
    const guideline="Kaiser: baby should eat 8-12 times in 24 hours, every 2-3 hours";
    if(lastHrs>=4)return {color:"red",label:"Needs Attention",reason:`Last nursing session was ${Math.floor(lastHrs)}h ago — baby shouldn't go 4+ hours without eating`,guideline,action:"Try to feed baby soon"};
    if(ct<6)return {color:"red",label:"Needs Attention",reason:`Only ${ct} nursing sessions in 24 hours — well below the 8-12 target`,guideline,action:"Increase feeding frequency. If baby won't latch, call your doctor"};
    if(lastHrs>=3)return {color:"yellow",label:"Monitor",reason:`Last feed was ${Math.floor(lastHrs)}h ago — approaching the 3-hour mark`,guideline,action:"Consider offering a feed soon"};
    if(ct<8)return {color:"yellow",label:"Monitor",reason:`${ct} sessions in 24 hours — below the 8-12 target`,guideline,action:"Try to increase feeding frequency"};
    return {color:"green",label:"On Track",reason:`${ct} sessions in 24 hours — right on target`,guideline,action:""};
  }
  if(type==="bottle"){
    const feeds=todayLogs.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk");
    const totalMl=feeds.reduce((s,l)=>{const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
    const lastBottle=all.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
    const lastHrs=lastBottle?(Date.now()-parseEntryDate(lastBottle))/3600000:Infinity;
    let expPerFeed="2-10";if(age>=4)expPerFeed="30-60";else if(age>=3)expPerFeed="15-30";else if(age>=2)expPerFeed="5-15";
    const guideline=`Kaiser: ${expPerFeed} mL per feeding on day ${age}`;
    if(feeds.length===0&&todayLogs.filter(l=>l.displayType==="breast").length>0)return {color:"green",label:"Breastfeeding",reason:"No bottle feeds today — nursing is primary",guideline:"Bottle supplements breastfeeding when needed",action:""};
    if(lastHrs>=4)return {color:"red",label:"Needs Attention",reason:`Last bottle feed was ${Math.floor(lastHrs)}h ago`,guideline,action:"Feed baby soon"};
    if(lastHrs>=3)return {color:"yellow",label:"Monitor",reason:`Last bottle feed was ${Math.floor(lastHrs)}h ago`,guideline,action:"Consider offering a feed"};
    if(age>7&&totalMl<90)return {color:"red",label:"Low Intake",reason:`Only ${totalMl} mL today (${(totalMl/29.5735).toFixed(1)} oz) — below minimum`,guideline,action:"Talk to your baby's doctor about intake"};
    if(age>7&&totalMl<150)return {color:"yellow",label:"Monitor",reason:`${totalMl} mL today (${(totalMl/29.5735).toFixed(1)} oz) — on the low side`,guideline,action:"Keep offering regular feeds"};
    return {color:"green",label:"On Track",reason:`${totalMl} mL today (${(totalMl/29.5735).toFixed(1)} oz) — ${feeds.length} feeds`,guideline,action:""};
  }
  if(type==="pump"){
    const todayPumps=todayLogs.filter(l=>l.displayType==="pump");
    const todayMl=todayPumps.reduce((s,l)=>{const m=(l.pumpAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
    const lastPump=all.filter(l=>l.displayType==="pump").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
    const lastHrs=lastPump?(Date.now()-parseEntryDate(lastPump))/3600000:Infinity;
    // 3-day avg
    let avg3=0,days3=0;for(let i=1;i<=3;i++){const d=new Date();d.setDate(d.getDate()-i);const ds=toDate(d);const ml=all.filter(l=>l.displayType==="pump"&&l.date===ds).reduce((s,l)=>{const m=(l.pumpAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);if(ml>0){avg3+=ml;days3++;}}
    avg3=days3>0?avg3/days3:0;
    const guideline="Kaiser: pump or breastfeed every 2-3 hours to maintain supply";
    if(lastHrs>=6)return {color:"red",label:"Session Overdue",reason:`No pump session in ${Math.floor(lastHrs)} hours — may affect supply`,guideline,action:"Pump soon to maintain supply"};
    if(lastHrs>=4)return {color:"yellow",label:"Monitor",reason:`Last pump was ${Math.floor(lastHrs)} hours ago`,guideline,action:"Try to pump within the next hour"};
    if(avg3>0&&todayMl<avg3*0.6)return {color:"red",label:"Low Output",reason:`${todayMl} mL today vs ${Math.round(avg3)} mL 3-day avg — significantly below`,guideline,action:"Stay hydrated, pump more frequently"};
    if(avg3>0&&todayMl<avg3*0.8)return {color:"yellow",label:"Below Average",reason:`${todayMl} mL today vs ${Math.round(avg3)} mL 3-day avg`,guideline,action:"Consider an extra pump session"};
    return {color:"green",label:"On Track",reason:`${todayMl} mL today (${(todayMl/29.5735).toFixed(1)} oz)${avg3>0?" — 3-day avg: "+Math.round(avg3)+" mL":""}`,guideline,action:""};
  }
  return {color:"green",label:"OK",reason:"",guideline:"",action:""};
}
function getFeedingScore(){
  const cutoff=Date.now()-24*3600000;
  const feeds=S.logs.filter(l=>(l.displayType==="breast"||l.displayType==="formula"||l.displayType==="breastmilk")&&parseEntryDate(l)>=cutoff);
  const ct=feeds.length;
  const todayBottle=S.logs.filter(l=>l.date===toDate(new Date())&&(l.displayType==="formula"||l.displayType==="breastmilk"));
  const ml=todayBottle.reduce((s,l)=>{const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
  let color="green";if(ct<6)color="red";else if(ct<8)color="yellow";
  return {count:ct,ml,color};
}
// Last feed timer
function getLastFeedInfo(){
  const feeds=S.logs.filter(l=>l.displayType==="breast"||l.displayType==="formula"||l.displayType==="breastmilk").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a));
  if(!feeds.length)return null;
  const ms=Date.now()-parseEntryDate(feeds[0]);
  const mins=Math.floor(ms/60000);
  const h=Math.floor(mins/60),m=mins%60;
  let cls="";if(mins>=180)cls="danger";else if(mins>=120)cls="warn";
  return {text:`${h}h ${m}m`,cls,type:feeds[0].displayType==="breast"?"nursed":"bottle fed"};
}
// Milestones
function getMilestones(){
  const age=babyAgeDays(),today=toDate(new Date()),all=S.logs;
  const todayLogs=all.filter(l=>l.date===today);
  const wet=todayLogs.filter(l=>l.pee).length;
  const nurseCount24=all.filter(l=>l.displayType==="breast"&&parseEntryDate(l)>=Date.now()-24*3600000).length;
  const hasSkinToSkin=true; // Can't track this, leave unchecked
  const items=[];
  if(age<=1){
    items.push({text:"Practice skin-to-skin contact",done:false});
    items.push({text:"Attempt breastfeeding at least 8 times",done:nurseCount24>=8});
    items.push({text:"Baby has had at least 1 wet diaper",done:wet>=1});
  }else if(age<=2){
    items.push({text:"Baby is more alert and feeding more often",done:false});
    items.push({text:"At least 2 wet diapers today",done:wet>=2});
    items.push({text:"Watch for cluster feeding (normal!)",done:false});
  }else if(age<=3){
    items.push({text:"Cluster feeding expected — this is normal",done:false});
    items.push({text:"At least 3 wet diapers today",done:wet>=3});
    items.push({text:"Milk should be coming in",done:false});
  }else if(age<=7){
    const target=Math.min(Math.max(age,1),6);
    items.push({text:`${target}+ wet diapers today`,done:wet>=target});
    items.push({text:"Stool transitioning to yellow",done:false});
    items.push({text:"Feeding 8-12 times per day",done:nurseCount24>=8});
    items.push({text:"Schedule first pediatric visit",done:false});
  }else{
    items.push({text:"6+ wet diapers daily",done:wet>=6});
    items.push({text:"8-12 feeds per day",done:nurseCount24>=8});
    items.push({text:"Steady weight gain (check with doctor)",done:false});
  }
  return {age,items};
}

async function syncFromSheet(){S.syncing=true;render();try{const r=await fetch(SCRIPT_URL);if(!r.ok)throw 0;const data=await r.json();const sheetEntries=data.map(row=>{const e={date:row["Today's Date"]||"",time:row["Time of Day"]||"",breastLength:row["Length of Breast Feeding"]||"",formulaAmount:row["Formula Amount"]||"",breastMilkAmount:row["Breast Milk Amount"]||"",side:row["Right Side/Left Side"]||"",pee:row["Pee"]||"",poop:row["Poop"]||"",pumpAmount:row["Pump Amount"]||""};if(e.date.includes("1899"))e.date="";if(e.time.includes("1899"))e.time="";e.displayType=classify(e);return e;}).filter(e=>e.date||e.time);const sheetKeys=new Map();sheetEntries.forEach(se=>{const k=dedupKey(se);sheetKeys.set(k,(sheetKeys.get(k)||0)+1);});const localOnly=S.logs.filter(l=>!l.fromSheet);const matchedKeys=new Map();localOnly.forEach(l=>{const k=dedupKey(l);const avail=(sheetKeys.get(k)||0)-(matchedKeys.get(k)||0);if(avail>0){l.synced=true;matchedKeys.set(k,(matchedKeys.get(k)||0)+1);}});const newFromSheet=[];const usedCounts=new Map();sheetEntries.forEach(se=>{const k=dedupKey(se);const lm=matchedKeys.get(k)||0;const u=usedCounts.get(k)||0;if(u<lm){usedCounts.set(k,u+1);}else{newFromSheet.push({...se,fromSheet:true,synced:true,id:"s-"+Math.random().toString(36).slice(2,8)});}});S.logs=[...localOnly,...newFromSheet];sortLogs();dedup();save();}catch(e){console.error("Sync:",e);}S.syncing=false;render();}
async function writeToSheet(entry){S.pendingWrites.push(entry);savePending();flushPending();}
async function flushPending(){while(S.pendingWrites.length>0){const entry=S.pendingWrites[0];try{const p=new URLSearchParams({action:"add",date:entry.date||"",timeOfDay:entry.time||"",breastLength:entry.breastLength||"",formulaAmount:entry.formulaAmount||"",breastMilkAmount:entry.breastMilkAmount||"",side:entry.side||"",pee:entry.pee||"",poop:entry.poop||"",pumpAmount:entry.pumpAmount||""});const r=await fetch(SCRIPT_URL+"?"+p.toString());if(r.ok){S.pendingWrites.shift();savePending();render();}else break;}catch{break;}}}
function addEntry(entry){entry.displayType=classify(entry);entry.id=Date.now().toString();S.logs.unshift(entry);sortLogs();save();S.form=null;render();writeToSheet(entry);}

function restoreEntry(idx){const e=S.recentlyDeleted.splice(idx,1)[0];if(!e)return;delete e.deletedAt;e.synced=false;e.fromSheet=false;e.id=Date.now().toString();S.logs.unshift(e);sortLogs();save();localStorage.setItem("bl-deleted",JSON.stringify(S.recentlyDeleted));writeToSheet(e);render();}

function editEntry(id){S.ctxMenu=null;const e=S.logs.find(l=>l.id===id);if(!e)return;S.editId=id;if(e.displayType==="diaper"){S.form="diaper";formPee=!!e.pee;formPoop=!!e.poop;formStoolColor=e.stoolColor||"";S.editTime=parseEditTime(e);}else if(e.displayType==="breast"){S.form="breast";formSide=e.side||"Left";S.editMins=parseInt(e.breastLength)||15;S.editTime=parseEditTime(e);}else if(e.displayType==="formula"||e.displayType==="breastmilk"){S.form="bottle";formBottleType=e.displayType==="formula"?"formula":"breastmilk";S.editMl=parseInt(e.formulaAmount||e.breastMilkAmount)||24;S.editTime=parseEditTime(e);}else if(e.displayType==="pump"){S.form="pump";S.editPump=parseInt(e.pumpAmount)||35;S.editTime=parseEditTime(e);}render();}
function parseEditTime(e){try{const tp=e.time.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return toISO(new Date());let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;const dp=e.date.split("/");return toISO(new Date(+dp[2],+dp[0]-1,+dp[1],h,m));}catch{return toISO(new Date());}}

// Day modal
function getDayStatus(type,dayLogs,age){
  if(type==="diaper"){const wet=dayLogs.filter(l=>l.pee).length;const target=Math.min(Math.max(age,1),6);if(wet>=target+1)return "green";if(wet>=target)return "yellow";return "red";}
  if(type==="nurse"){const ct=dayLogs.filter(l=>l.displayType==="breast").length;if(ct>=8)return "green";if(ct>=6)return "yellow";return "red";}
  if(type==="bottle"){const ml=dayLogs.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk").reduce((s,l)=>{const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);if(dayLogs.filter(l=>l.displayType==="breast").length>0&&ml===0)return "green";if(age>7&&ml<90)return "red";if(age>7&&ml<150)return "yellow";return "green";}
  if(type==="pump"){const ml=dayLogs.filter(l=>l.displayType==="pump").reduce((s,l)=>{const m=(l.pumpAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);if(ml>0)return "green";return "yellow";}
  return "green";
}
function renderDayModal(){if(!S.selectedDay&&!S.selectedRange)return "";let dayLogs,title;if(S.selectedRange==="12h"){const cutoff=Date.now()-12*3600000;dayLogs=S.logs.filter(l=>{const t=parseEntryDate(l);return t>=cutoff&&t<=Date.now();}).sort((a,b)=>parseEntryDate(a)-parseEntryDate(b));title="Last 12 Hours";}else{const ds=S.selectedDay;dayLogs=S.logs.filter(l=>l.date===ds).sort((a,b)=>parseEntryDate(a)-parseEntryDate(b));const[mm,dd,yy]=ds.split("/");title=new Date(+yy,+mm-1,+dd).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});}
  const age=babyAgeDays();
  const diapers=dayLogs.filter(l=>l.displayType==="diaper").length;
  const wet=dayLogs.filter(l=>l.pee).length;const dirty=dayLogs.filter(l=>l.poop).length;

  const nm=ne.reduce((s,l)=>s+(parseInt(l.breastLength)||0),0);
  const be=dayLogs.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk");
  const bm=be.reduce((s,l)=>{const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
  const pe=dayLogs.filter(l=>l.displayType==="pump");
  const pm=pe.reduce((s,l)=>{const m=(l.pumpAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);
  const dSt=getDayStatus("diaper",dayLogs,age);
  const nSt=getDayStatus("nurse",dayLogs,age);
  const bSt=getDayStatus("bottle",dayLogs,age);
  const pSt=getDayStatus("pump",dayLogs,age);
  let stats=`<div class="summary">
    <div class="s-card" style="background:var(--diaper-bg)"><button class="status-dot ${dSt}"></button><div class="s-card-slide"><div class="num" style="color:var(--diaper-fg)">${diapers}</div><div class="label">diapers</div><div class="sub">${wet} 💧 wet · ${dirty} 💩 dirty</div></div></div>
    <div class="s-card" style="background:var(--nurse-bg)"><button class="status-dot ${nSt}"></button><div class="s-card-slide"><div class="num" style="color:var(--nurse-fg)">${nm}<span style="font-size:11px"> min</span></div><div class="label">${ne.length} nursing sessions</div></div></div>
    <div class="s-card" style="background:var(--bottle-bg)"><button class="status-dot ${bSt}"></button><div class="s-card-slide"><div class="num" style="color:var(--bottle-fg)">${(bm/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">${be.length} bottle feeds</div><div class="sub">${bm} mL</div></div></div>
    <div class="s-card" style="background:var(--pump-bg)"><button class="status-dot ${pSt}"></button><div class="s-card-slide"><div class="num" style="color:var(--pump-fg)">${(pm/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">${pe.length} pump sessions</div><div class="sub">${pm} mL</div></div></div>
  </div>`;
  let entries="";if(S.dayExpanded){dayLogs.slice().reverse().forEach(e=>{const c=EC[e.displayType]||EC.other;entries+=`<div class="entry" style="background:${c.bg};border-color:${c.accent}"><div class="info"><div class="sum" style="font-size:13px">${sumText(e)}</div></div><div style="font-size:11px;color:var(--muted)">${e.time}</div></div>`;});}
  const hb=dayLogs.length>0?`<button onclick="toggleDayExpand()" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--divider);font-size:14px;font-weight:600;color:var(--text);background:none;border-bottom:none;border-left:none;border-right:none;cursor:pointer">Full history (${dayLogs.length})<span>${S.dayExpanded?"▴":"▾"}</span></button>`:"<div style='text-align:center;padding:20px;color:var(--muted);font-size:13px'>No activity</div>";

// Storage timers
function renderStorageTimers(){if(S.storageTimers.length===0)return "";const now=Date.now();const limits={counter:4*3600000,fridge:4*24*3600000,freezer:6*30*24*3600000};const warns={counter:3*3600000,fridge:3*24*3600000,freezer:5*30*24*3600000};const labels={counter:"🏠 Counter",fridge:"❄️ Fridge",freezer:"🧊 Freezer"};let h=`<div class="history-title">🍼 Milk Storage</div>`;S.storageTimers.forEach((t,i)=>{const elapsed=now-t.started;const limit=limits[t.type];const warn=warns[t.type];let timeStr="";const hrs=Math.floor(elapsed/3600000);if(t.type==="counter"){timeStr=`${hrs}h ${Math.floor((elapsed%3600000)/60000)}m / 4h`;}else if(t.type==="fridge"){const days=Math.floor(hrs/24);timeStr=`${days}d ${hrs%24}h / 4 days`;}else{const months=Math.floor(elapsed/(30*24*3600000));timeStr=`${months}mo / 6 months`;}let color="var(--green)";if(elapsed>=limit)color="var(--red)";else if(elapsed>=warn)color="var(--yellow)";h+=`<div class="storage-card"><div class="s-info"><div style="font-weight:600">${labels[t.type]} · ${t.ml} mL</div><div style="font-size:11px;color:var(--muted)">${new Date(t.started).toLocaleString()}</div></div><div class="s-time" style="color:${color}">${timeStr}</div><button onclick="removeStorage(${i})" style="color:var(--mutedLight);font-size:16px;padding:4px">✕</button></div>`;});return h;}
function removeStorage(i){S.storageTimers.splice(i,1);saveStorage();render();}

function render(){
  if(!getBirthDate()){document.getElementById("app").innerHTML=renderSetup();return;}
  const age=babyAgeDays();
  const syncLabel=S.syncing?"Syncing...":S.pendingWrites.length>0?`${S.pendingWrites.length} pending`:"Synced";
  const syncBg=S.syncing?"#ffe1d0":"#eee7db";const syncColor=S.syncing?"#8c491a":"var(--muted)";
  let h=`<div class="header"><button class="call-btn" onclick="S.callRef=true;render()">☎️</button><h1>Activity Log</h1><div class="name">Alaiya Maeve Querubin</div><div class="date">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div><div class="age">Day ${age}</div><span class="badge" style="background:${syncBg};color:${syncColor}">${syncLabel}</span></div>`;
  h+=renderFeedTimer();
  if(S.logs.length>0){h+=renderSummary();h+=renderChart();}
  h+=renderMilestones();
  if(!S.form){h+=`<div class="actions"><button class="act-btn" style="background:var(--diaper-bg);color:var(--diaper-fg)" onclick="S.form='diaper';render()"><span style="font-size:26px">🧷</span>Diaper</button><button class="act-btn" style="background:var(--nurse-bg);color:var(--nurse-fg)" onclick="S.form='breast';render()"><span style="font-size:26px">🤱</span>Nurse</button><button class="act-btn" style="background:var(--bottle-bg);color:var(--bottle-fg)" onclick="S.form='bottle';render()"><span style="font-size:26px">🍼</span>Bottle</button><button class="act-btn" style="background:var(--pump-bg);color:var(--pump-fg)" onclick="S.form='pump';render()"><span style="font-size:26px">🥛</span>Pump</button></div>`;}else{h+=renderForm();}
  h+=renderStorageTimers();
  h+=`<div class="history-title">History (${S.logs.length})</div>`;
  if(S.logs.length===0&&!S.syncing)h+=`<div class="empty">No logs yet — tap a button above to start</div>`;
  else{S.logs.slice(0,S.showCount).forEach((e,i)=>{h+=renderEntry(e,i);});if(S.logs.length>S.showCount)h+=`<button class="show-more" onclick="showMore()">Show more (${S.logs.length-S.showCount} older)</button>`;}
  if(S.recentlyDeleted.length>0)h+=renderDeletedSection();
  h+=renderDayModal();h+=renderCtxMenu();h+=renderConfirmModal();h+=renderStatusModal();h+=renderCallRef();
  document.getElementById("app").innerHTML=h;
}
// Helpers
function togglePill(t){if(t==="pee")formPee=!formPee;if(t==="poop"){formPoop=!formPoop;if(!formPoop)formStoolColor="";}render();}
function pickSide(s){formSide=s;render();}
function pickBottle(t){formBottleType=t;render();}
function stepMin(d){const el=document.getElementById("f-mins");el.value=Math.max(1,Math.min(120,(+el.value||0)+d));}
function stepMl(d){const el=document.getElementById("f-ml");el.value=Math.max(1,Math.min(500,(+el.value||0)+d));}
function stepPump(d){const el=document.getElementById("f-pump");el.value=Math.max(1,Math.min(500,(+el.value||0)+d));}
function setMl(v){document.getElementById("f-ml").value=v;}
function setMin(v){document.getElementById("f-mins").value=v;}
function setPump(v){document.getElementById("f-pump").value=v;}
function clampMin(){const el=document.getElementById("f-mins");el.value=Math.max(1,Math.min(120,+el.value||1));}
function clampMl(){const el=document.getElementById("f-ml");el.value=Math.max(1,Math.min(500,+el.value||1));}
function clampPump(){const el=document.getElementById("f-pump");el.value=Math.max(1,Math.min(500,+el.value||1));}
function showMore(){S.showCount+=10;render();}
function openDay(ds){S.selectedDay=ds;S.selectedRange=null;S.dayExpanded=false;render();}
function openYesterday(){const d=new Date();d.setDate(d.getDate()-1);S.selectedDay=toDate(d);S.selectedRange=null;S.dayExpanded=false;render();}
function openLast12h(){S.selectedDay=null;S.selectedRange="12h";S.dayExpanded=false;render();}
function closeDay(){S.selectedDay=null;S.selectedRange=null;render();}
function toggleDayExpand(){S.dayExpanded=!S.dayExpanded;render();}
function saveDiaper(){if(!formPee&&!formPoop)return;const d=new Date(document.getElementById("f-time").value);if(S.editId)S.logs=S.logs.filter(l=>l.id!==S.editId);const poopVal=formPoop?(formStoolColor?"X - "+formStoolColor:"X"):"";const entry={date:toDate(d),time:toTime(d),pee:formPee?"X":"",poop:poopVal};if(formStoolColor)entry.stoolColor=formStoolColor;addEntry(entry);formPee=false;formPoop=false;formStoolColor="";S.editId=null;S.editTime=null;}
function saveBreast(){const mins=document.getElementById("f-mins").value;const d=new Date(document.getElementById("f-time").value);if(S.editId)S.logs=S.logs.filter(l=>l.id!==S.editId);addEntry({date:toDate(d),time:toTime(d),breastLength:mins+" min",side:formSide});formSide="Left";S.editId=null;S.editTime=null;S.editMins=null;}
function saveBottle(){const ml=document.getElementById("f-ml").value;const d=new Date(document.getElementById("f-time").value);if(S.editId)S.logs=S.logs.filter(l=>l.id!==S.editId);addEntry({date:toDate(d),time:toTime(d),formulaAmount:formBottleType==="formula"?ml+" mL":"",breastMilkAmount:formBottleType==="breastmilk"?ml+" mL":""});formBottleType="breastmilk";S.editId=null;S.editTime=null;S.editMl=null;}
function savePump(){const ml=document.getElementById("f-pump").value;const d=new Date(document.getElementById("f-time").value);if(S.editId)S.logs=S.logs.filter(l=>l.id!==S.editId);if(S.pumpStorage){S.storageTimers.push({type:S.pumpStorage,ml:+ml,started:Date.now()});saveStorage();}addEntry({date:toDate(d),time:toTime(d),pumpAmount:ml+" mL"});S.editId=null;S.editTime=null;S.editPump=null;S.pumpStorage="";}
// Init
render();syncFromSheet();if(S.pendingWrites.length>0)flushPending();
// Dot indicator observer — runs after each render
const origRender=render;
function renderWithDots(){origRender();document.querySelectorAll(".s-card-scroll").forEach(scroll=>{const dots=scroll.closest(".s-card").querySelector(".dots");if(!dots)return;const spans=dots.querySelectorAll("span");scroll.addEventListener("scroll",()=>{const idx=Math.round(scroll.scrollLeft/scroll.offsetWidth);spans.forEach((s,i)=>{s.className=i===idx?"active":"";});},{passive:true});});}
render=renderWithDots;render();
// Live timer update
setInterval(()=>{const el=document.querySelector(".feed-timer");if(el){const f=getLastFeedInfo();if(f){el.className="feed-timer "+(f.cls||"");el.innerHTML=`Last ${f.type} <span class="time-val">${f.text}</span> ago`;}}},60000);
// Storage timer update
setInterval(()=>{if(S.storageTimers.length>0)render();},300000);
</script>
</body>
</html>
