<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Activity Log">
<meta name="theme-color" content="#f5ead8">
<title>Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5ead8;--surface:#ebddc5;--surfaceLight:#fffdf9;--text:#201e1d;--muted:#82796a;--mutedLight:#a19786;--divider:rgba(32,30,29,.12);--accent:#c67139;--accent2:#7a8a5e;--green:#5a9a5a;--yellow:#d4952b;--red:#c44a3f;--diaper-bg:oklch(90% 0.035 55);--diaper-fg:oklch(34% 0.055 42);--diaper-accent:oklch(55% 0.07 48);--nurse-bg:#f0fae1;--nurse-fg:#3d472b;--nurse-accent:#8fa073;--bottle-bg:oklch(90% 0.045 235);--bottle-fg:oklch(36% 0.08 235);--bottle-accent:oklch(64% 0.10 235);--pump-bg:oklch(92% 0.07 95);--pump-fg:oklch(42% 0.12 85);--pump-accent:oklch(65% 0.14 90);--radius:28px;--shadow:0 3px 10px rgba(46,43,37,.16);--font-h:'Caprasimo',system-ui,sans-serif;--font-b:'Figtree',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100dvh;padding:env(safe-area-inset-top) 16px 90px;max-width:480px;margin:0 auto}
body *{touch-action:manipulation}
button{font-family:var(--font-b);cursor:pointer;border:none;background:none;color:inherit}
input[type=number],input[type=datetime-local],input[type=date],input[type=time]{font-family:var(--font-b)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:400}
/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surfaceLight);border-top:1px solid var(--divider);display:flex;justify-content:center;z-index:40;padding:6px 0 env(safe-area-inset-bottom,8px)}
.nav-inner{display:flex;max-width:480px;width:100%}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10px;font-weight:600;color:var(--mutedLight);transition:color .15s}
.nav-item.on{color:var(--accent)}
.nav-item .ni-icon{font-size:22px;height:26px;display:flex;align-items:center;justify-content:center}
/* HEADER */
.header{text-align:center;padding:16px 0 8px;position:relative}
.header h1{font-size:26px}.header .name{font-size:14px;color:var(--accent);font-weight:600;margin-top:4px}.header .date{font-size:13px;color:var(--muted);margin-top:4px}.header .age{font-size:11px;color:var(--mutedLight);margin-top:2px}
.badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px}
.call-btn{position:absolute;right:4px;top:16px;width:36px;height:36px;border-radius:50%;background:#eee7db;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
/* FEED TIMER BAR */
.feed-timer{display:flex;gap:10px;margin-bottom:14px}
.feed-timer .ft-item{flex:1;text-align:center;padding:10px 6px;border-radius:16px;background:#ffffff88}
.feed-timer .ft-time{font-family:var(--font-h);font-size:18px}.feed-timer .ft-label{font-size:11px;color:var(--muted);margin-top:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.ft-warn .ft-time{color:var(--yellow)}.ft-danger .ft-time{color:var(--red)}.ft-danger{animation:pulse 2s infinite}
/* CARDS */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.s-card{border-radius:var(--radius);position:relative;overflow:hidden}
.s-card-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1}
.s-card-scroll::-webkit-scrollbar{display:none}
.s-card-slide{min-width:100%;scroll-snap-align:start;padding:14px 10px;text-align:center;flex-shrink:0}
.s-card .num{font-size:22px;font-weight:700;font-family:var(--font-h)}.s-card .label{font-size:11px;color:var(--muted);margin-top:2px}.s-card .sub{font-size:10px;color:var(--mutedLight);margin-top:3px;line-height:1.4}
.progress-slide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.progress-slide .p-label{font-size:11px;font-weight:600;color:var(--muted)}.progress-slide .p-target{font-size:10px;color:var(--mutedLight)}
.progress-bar{width:80%;height:10px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden}.progress-fill{height:100%;border-radius:5px;transition:width .3s}
.progress-num{font-family:var(--font-h);font-size:20px;font-weight:700}
.dots{display:flex;gap:4px;justify-content:center;position:absolute;bottom:6px;left:0;right:0}.dots span{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.15)}.dots span.active{background:rgba(0,0,0,.4)}
.status-dot{position:absolute;top:10px;right:10px;width:11px;height:11px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.6);z-index:5;padding:0;min-width:22px;min-height:22px;display:flex;align-items:center;justify-content:center;background-clip:padding-box;background:transparent}
.status-dot::after{content:"";width:11px;height:11px;border-radius:50%}
.status-dot.green::after{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.yellow::after{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.status-dot.red::after{background:var(--red);box-shadow:0 0 6px var(--red)}
/* CHART */
.chart-wrap{background:#ffffffaa;border-radius:var(--radius);padding:16px 16px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;background:none;border:none;padding:0;cursor:pointer;font-family:var(--font-b)}
/* TIMER */
.timer-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.timer-card{border-radius:var(--radius);padding:20px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.timer-card .timer-display{font-family:var(--font-h);font-size:32px;letter-spacing:1px}
.timer-card .timer-label{font-size:12px;font-weight:600}.timer-card .timer-sub{font-size:10px;color:var(--mutedLight)}
@keyframes timerPulse{0%,100%{box-shadow:0 0 0 0 rgba(122,138,94,.3)}50%{box-shadow:0 0 0 10px rgba(122,138,94,0)}}
.timer-card.running{animation:timerPulse 2s infinite}
.timer-confirm{background:var(--surfaceLight);border-radius:var(--radius);padding:28px 22px;max-width:340px;width:90%;box-shadow:0 12px 40px rgba(32,30,29,.3)}
.timer-confirm h3{font-family:var(--font-h);font-size:16px;margin-bottom:14px;text-align:center}
.timer-summary{display:flex;justify-content:center;gap:16px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.timer-summary .ts-item{text-align:center}.timer-summary .ts-val{font-family:var(--font-h);font-size:18px;color:var(--text)}
/* MILESTONES PAGE */
.ms-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ms-header h2{flex:1;font-size:20px}
.ms-stats{display:flex;gap:10px;margin-bottom:18px}
.ms-stat{flex:1;text-align:center;padding:14px 8px;border-radius:var(--radius);background:#ffffffaa}
.ms-stat .ms-num{font-family:var(--font-h);font-size:24px;color:var(--accent)}.ms-stat .ms-label{font-size:10px;color:var(--muted);margin-top:2px}
.ms-filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none}
.ms-filters::-webkit-scrollbar{display:none}
.ms-filter{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;background:#eee7db;color:var(--muted)}
.ms-filter.on{background:var(--accent);color:#fff}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--accent),var(--accent2),var(--yellow))}
.tl-node{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-24px;top:8px;width:20px;height:20px;border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px}
.tl-dot.done{background:var(--green);color:#fff;border-color:var(--green)}
.tl-dot.upcoming{background:#eee7db;color:var(--muted);border-color:#ddd}
.tl-dot.current{background:var(--yellow);color:#fff;border-color:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.tl-card{background:var(--surfaceLight);border-radius:16px;padding:14px 14px;box-shadow:var(--shadow)}
.tl-card.done{opacity:.75}
.tl-card .tl-title{font-size:14px;font-weight:700;margin-bottom:2px}
.tl-card .tl-cat{font-size:10px;color:var(--mutedLight);margin-bottom:4px}
.tl-card .tl-desc{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:6px}
.tl-card .tl-avg{font-size:10px;color:var(--accent);font-weight:600}
.tl-card .tl-achieved{font-size:11px;color:var(--green);font-weight:600;margin-top:4px}
.tl-card .tl-actions{display:flex;gap:6px;margin-top:8px}
.tl-card .tl-btn{padding:6px 14px;border-radius:999px;font-size:11px;font-weight:600}
/* HISTORY PAGE */
.h-filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.h-filter{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted)}
.h-filter.on{background:var(--accent);color:#fff}
.h-range{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted)}
.h-range input{padding:6px 10px;border-radius:10px;border:1px solid #dcd3c4;background:#fff;font-size:12px}
/* FORMS */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.act-btn{padding:18px 6px;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px}
.form-card{background:var(--surfaceLight);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.form-header{display:flex;align-items:center;margin-bottom:18px}
.back-btn{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:14px;font-weight:600;padding:4px 0}
.form-title{flex:1;text-align:center;font-family:var(--font-h);font-size:16px;margin-right:56px}
.form-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.pill{padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;border:2px solid transparent}.pill.on{border-color:currentColor}
.stepper{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:14px}
.stepper button{width:38px;height:40px;border-radius:12px;background:#eee7db;font-size:18px;color:var(--text)}
.stepper .val{width:70px;text-align:center;padding:8px 4px;border-radius:12px;background:#fff;border:2px solid #dcd3c4;font-size:20px;font-weight:700;font-family:var(--font-h);-moz-appearance:textfield}
.stepper .unit{color:var(--muted);font-size:13px}
.quick{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.quick button{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted)}
.time-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:20px}
.time-row input{padding:8px 12px;border-radius:10px;border:1px solid #dcd3c4;background:#fff;color:var(--text);font-size:14px}
.btn-row{display:flex;gap:10px;justify-content:center}
.cancel-btn{padding:8px 16px;border-radius:999px;color:var(--accent);font-size:14px;font-family:var(--font-h)}
.save-btn{padding:12px 32px;border-radius:999px;font-size:15px;font-weight:700;color:#fff}
.stool-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.stool-dot{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}.stool-dot.on{border-color:var(--text);transform:scale(1.15)}
/* ENTRIES */
.history-title{margin:6px 0 12px 2px;font-size:14px;font-weight:700;color:var(--muted);font-family:var(--font-h)}
.entry{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;margin-bottom:8px;border-left:4px solid;user-select:none;-webkit-user-select:none}
.entry .info{flex:1}.entry .sum{font-size:14px;font-weight:600}.entry .time{font-size:12px;color:var(--muted);margin-top:3px}
.entry .spinner{width:18px;height:18px;border:2px solid var(--mutedLight);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.show-more{display:block;margin:8px auto;padding:8px 20px;border-radius:999px;color:var(--accent);font-size:14px;font-family:var(--font-h)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;background:#ffffff88;border-radius:var(--radius)}
/* MILESTONES SECTION */
.milestones{background:#ffffffaa;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.milestone-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:13px;font-weight:700;color:var(--text)}
.m-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--divider);font-size:13px;line-height:1.4}
.m-check{width:20px;height:20px;border-radius:6px;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}.m-check.done{background:var(--green);border-color:var(--green);color:#fff}
/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(32,30,29,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:480px;max-height:85vh;min-height:80vh;overflow-y:auto;background:var(--surfaceLight);border-radius:var(--radius) var(--radius) 0 0;padding:22px 20px 28px;box-shadow:0 -12px 32px rgba(32,30,29,.22)}
.modal-title{font-family:var(--font-h);font-size:18px}
.modal-close{width:32px;height:32px;border-radius:999px;background:#eee7db;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.confirm-modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(32,30,29,.45)}
.confirm-box{background:var(--surfaceLight);border-radius:var(--radius);padding:24px 20px;max-width:300px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(32,30,29,.3)}
.confirm-box h3{font-family:var(--font-h);font-size:17px;margin-bottom:6px}.confirm-box p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.4}
.confirm-btns{display:flex;gap:10px;justify-content:center}.confirm-btns button{padding:10px 22px;border-radius:999px;font-size:14px;font-weight:700}
.status-panel{padding:16px;border-radius:16px;margin-bottom:12px}
.status-panel h4{font-size:15px;margin-bottom:8px}.status-panel p{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:6px}
.status-panel .guideline{font-size:12px;font-style:italic;color:var(--mutedLight);border-left:3px solid;padding-left:10px;margin:10px 0}
.status-panel .action{font-size:13px;font-weight:600;margin-top:8px}
.call-ref h4{font-size:14px;font-family:var(--font-h);margin:14px 0 8px;color:var(--text)}
.call-ref ul{padding-left:18px;margin-bottom:8px}.call-ref li{font-size:12px;line-height:1.5;color:var(--muted);margin-bottom:4px}.call-ref .emergency{color:var(--red);font-weight:600}
.ctx-menu{position:fixed;z-index:60;background:var(--surfaceLight);border-radius:16px;box-shadow:0 8px 32px rgba(32,30,29,.28);padding:6px;min-width:180px}
.ctx-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;width:100%;text-align:left}.ctx-item:active{background:#eee7db}
.ctx-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.ctx-sep{height:1px;background:var(--divider);margin:2px 8px}
.ctx-overlay{position:fixed;inset:0;z-index:55;background:rgba(32,30,29,.3)}
.setup-modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(32,30,29,.6)}
.setup-box{background:var(--surfaceLight);border-radius:var(--radius);padding:28px 24px;max-width:320px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(32,30,29,.3)}
.setup-box h2{font-family:var(--font-h);font-size:20px;margin-bottom:6px}.setup-box p{font-size:13px;color:var(--muted);margin-bottom:16px}
.setup-box input{padding:10px 14px;border-radius:12px;border:2px solid #dcd3c4;background:#fff;font-size:16px;width:100%;text-align:center;margin-bottom:16px}
.setup-box button{padding:12px 32px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;background:var(--accent)}
.deleted-section{margin-top:24px;padding-top:16px;border-top:1px solid var(--divider)}
.deleted-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 2px;font-size:13px;font-weight:600;color:var(--mutedLight)}
.deleted-entry{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:#eee7db;opacity:.6}
.deleted-entry .info{flex:1}.deleted-entry .sum{font-size:13px;font-weight:600;color:var(--muted)}.deleted-entry .time{font-size:11px;color:var(--mutedLight);margin-top:2px}
.restore-btn{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent2);color:#fff;flex-shrink:0}
.ms-search{width:100%;padding:10px 14px;border-radius:14px;border:2px solid #dcd3c4;background:#fff;font-size:14px;margin-bottom:14px}
</style>
</head>

function renderSummary(){const today=toDate(new Date()),age=babyAgeDays(),all=S.logs,t=all.filter(l=>l.date===today);const ds=getStatus("diaper"),ns=getStatus("nurse"),bs=getStatus("bottle"),ps=getStatus("pump");const wet=t.filter(l=>l.pee).length,diapers=t.filter(l=>l.displayType==="diaper").length,wt=Math.min(Math.max(age,1),6);const lastD=all.filter(l=>l.displayType==="diaper").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];let dS="";if(lastD)dS=`<div class="sub">${timeSince(lastD.date,lastD.time)}</div>`;const c24=Date.now()-864e5,nSess=all.filter(l=>l.displayType==="breast"&&parseEntryDate(l)>=c24).length;const lastN=all.filter(l=>l.displayType==="breast").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];const nB=lastN?(lastN.side||"?"):"—";let nS="";if(lastN)nS=`<div class="sub">${lastN.breastLength} · ${timeSince(lastN.date,lastN.time)}</div>`;const bMl=t.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk").reduce((s,l)=>{const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);let bT=60;if(age<=1)bT=10;else if(age<=2)bT=15;else if(age<=3)bT=30;else if(age<=7)bT=60;else bT=150;const lastB=all.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];let bS="";if(lastB)bS=`<div class="sub">${lastB.formulaAmount||lastB.breastMilkAmount} · ${timeSince(lastB.date,lastB.time)}</div>`;const pMl=t.filter(l=>l.displayType==="pump").reduce((s,l)=>{const m=(l.pumpAmount||"").match(/(\d+)/);return s+(m?+m[1]:0);},0);const lastP=all.filter(l=>l.displayType==="pump").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];let pS="";if(lastP)pS=`<div class="sub">${lastP.pumpAmount} · ${timeSince(lastP.date,lastP.time)}</div>`;
return `<div class="summary">${swipeCard("var(--diaper-bg)",ds.color,"S.statusModal='diaper';render()",`<div class="num" style="color:var(--diaper-fg)">${diapers}</div><div class="label">diapers today</div>${dS}`,progressBar(wet,wt,null,"wet diapers",`Day ${age}: ${wt}+`))}${swipeCard("var(--nurse-bg)",ns.color,"S.statusModal='nurse';render()",`<div class="num" style="color:var(--nurse-fg)">${nB}</div><div class="label">last side</div>${nS}`,progressBar(nSess,8,null,"sessions (24h)","Goal: 8-12"))}${swipeCard("var(--bottle-bg)",bs.color,"S.statusModal='bottle';render()",`<div class="num" style="color:var(--bottle-fg)">${(bMl/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">bottle · ${bMl} mL</div>${bS}`,progressBar(bMl,bT,null,"mL",`Day ${age}: ~${bT}`))}${swipeCard("var(--pump-bg)",ps.color,"S.statusModal='pump';render()",`<div class="num" style="color:var(--pump-fg)">${(pMl/29.5735).toFixed(1)}<span style="font-size:11px"> oz</span></div><div class="label">pumped · ${pMl} mL</div>${pS}`,progressBar(pMl,pMl||100,null,"mL",""))}</div>`;}

function renderChart(){const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];const cts=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=toDate(d);cts.push({ds,count:S.logs.filter(l=>l.date===ds).length,isToday:i===0,dow:d.getDay()});}const mx=Math.max(1,...cts.map(c=>c.count));let bars="";cts.forEach(c=>{const sel=S.selectedDay===c.ds;const pct=c.count===0?4:Math.round((c.count/mx)*100);bars+=`<button class="chart-bar-wrap" onclick="openDay('${c.ds}')"><div style="width:100%;max-width:26px;border-radius:8px 8px 3px 3px;background:${sel?"var(--accent)":c.isToday?"#d67f48":"#f6a06b"};height:${pct}%;min-height:4px"></div><span style="font-size:9px;color:${sel?"var(--accent)":c.isToday?"#8c491a":"var(--mutedLight)"};font-weight:${c.isToday||sel?"700":"400"}">${dow[c.dow]}</span></button>`;});return `<div class="chart-wrap"><div style="display:flex;align-items:center;gap:6px;margin-bottom:12px"><span style="font-size:13px;font-weight:600;flex:1">Last 7 days</span><button onclick="openYesterday()" style="padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted)">Yesterday</button><button onclick="openLast12h()" style="padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#eee7db;color:var(--muted)">Last 12h</button></div><div style="display:flex;align-items:flex-end;gap:8px;height:70px">${bars}</div></div>`;}
function renderDailyMilestones(){const age=babyAgeDays(),today=toDate(new Date()),t=S.logs.filter(l=>l.date===today);const wet=t.filter(l=>l.pee).length,nc=S.logs.filter(l=>l.displayType==="breast"&&parseEntryDate(l)>=Date.now()-864e5).length;const items=[];if(age<=1){items.push({t:"Practice skin-to-skin",d:false},{t:"8+ breastfeeding attempts",d:nc>=8},{t:"≥1 wet diaper",d:wet>=1});}else if(age<=2){items.push({t:"Baby more alert, feeding more",d:false},{t:`≥2 wet diapers (${wet})`,d:wet>=2},{t:"Cluster feeding is normal!",d:false});}else if(age<=3){items.push({t:"Cluster feeding expected",d:false},{t:`≥3 wet diapers (${wet})`,d:wet>=3},{t:"Milk coming in",d:false});}else if(age<=7){const tg=Math.min(age,6);items.push({t:`≥${tg} wet diapers (${wet})`,d:wet>=tg},{t:"Stool turning yellow",d:false},{t:"8-12 feeds/day",d:nc>=8},{t:"First pediatric visit",d:false});}else{items.push({t:`≥6 wet diapers (${wet})`,d:wet>=6},{t:"8-12 feeds/day",d:nc>=8},{t:"Steady weight gain",d:false});}let h=items.map(m=>`<div class="m-item"><div class="m-check${m.d?" done":""}">${m.d?"✓":""}</div><div>${m.t}</div></div>`).join("");return `<div class="milestones"><button class="milestone-toggle" onclick="S.showMilestones=!S.showMilestones;render()">📋 Day ${age} Milestones <span>${S.showMilestones?"▴":"▾"}</span></button>${S.showMilestones?h:""}</div>`;}

function renderMilestonesPage(){

  });
  h+=`</div>`;

  h+=`<button onclick="addCustomMilestone()" style="display:block;margin:16px auto;padding:12px 24px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:14px">+ Add Custom Milestone</button>`;
  return h;
}

function renderHistoryPage(){

let stats=`<div class="summary">${swipeCard("var(--diaper-bg)",dSt,"S.statusModal='diaper';render()",`<div class="num" style="color:var(--diaper-fg)">${di}</div><div class="label">diapers</div><div class="sub">${wet}💧 ${dirty}💩</div>`,progressBar(wet,wt,null,"wet",`Goal: ${wt}+`))}${swipeCard("var(--nurse-bg)",nSt,"S.statusModal='nurse';render()",`<div class="num" style="color:var(--nurse-fg)">${nm}<span style="font-size:11px">min</span></div><div class="label">${ne.length} sessions</div>`,progressBar(ne.length,8,null,"sessions","Goal: 8-12"))}${swipeCard("var(--bottle-bg)",bSt,"S.statusModal='bottle';render()",`<div class="num" style="color:var(--bottle-fg)">${(bm/29.5735).toFixed(1)}<span style="font-size:11px">oz</span></div><div class="label">${be.length} feeds · ${bm}mL</div>`,progressBar(bm,bT,null,"mL",`~${bT}`))}${swipeCard("var(--pump-bg)",pSt,"S.statusModal='pump';render()",`<div class="num" style="color:var(--pump-fg)">${(pm/29.5735).toFixed(1)}<span style="font-size:11px">oz</span></div><div class="label">${pe.length} pumps · ${pm}mL</div>`,progressBar(pm,pm||100,null,"mL",""))}</div><div class="summary" style="grid-template-columns:1fr">${swipeCard("#fff8ee",fC,"S.statusModal='feeding';render()",`<div class="num" style="color:var(--accent)">${tf}</div><div class="label">total feeds</div>`,progressBar(tf,8,null,"feeds","Goal: 8-12"))}</div>`;
let entries="";if(S.dayExpanded)dl.slice().reverse().forEach(e=>{const c=EC[e.displayType]||EC.other;entries+=`<div class="entry" style="background:${c.bg};border-color:${c.accent}"><div class="info"><div class="sum" style="font-size:13px">${sumText(e)}</div></div><div style="font-size:11px;color:var(--muted)">${e.time}</div></div>`;});
const hb=dl.length>0?`<button onclick="toggleDayExpand()" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--divider);font-size:14px;font-weight:600;color:var(--text);background:none;border-bottom:none;border-left:none;border-right:none">Full history (${dl.length})<span>${S.dayExpanded?"▴":"▾"}</span></button>`:`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No activity</div>`;
return `<div class="modal-bg" onclick="closeDay()"><div class="modal" onclick="event.stopPropagation()"><div style="display:flex;align-items:center;margin-bottom:16px"><div class="modal-title" style="flex:1">${title}</div><button class="modal-close" onclick="closeDay()">✕</button></div>${stats}${hb}${entries}</div></div>`;}
// MAIN RENDER
function render(){
  if(!getBirthDate()){document.getElementById("app").innerHTML=renderSetup();return;}
  const age=babyAgeDays();const syncL=S.syncing?"Syncing...":S.pendingWrites.length>0?S.pendingWrites.length+" pending":"Synced";
  let h=`<div class="header"><button class="call-btn" onclick="S.callRef=true;render()">☎️</button><h1>Activity Log</h1><div class="name">Alaiya Maeve Querubin</div><div class="date">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div><div class="age">Day ${age}</div><span class="badge" style="background:${S.syncing?"#ffe1d0":"#eee7db"};color:${S.syncing?"#8c491a":"var(--muted)"}">${syncL}</span></div>`;
  if(S.tab==="home"){h+=renderFeedTimer();if(S.logs.length>0){h+=renderSummary();h+=renderTimerRow();h+=renderChart();}else h+=renderTimerRow();h+=renderDailyMilestones();}
  else if(S.tab==="log"){h+=renderLogPage();}
  else if(S.tab==="milestones"){h+=renderMilestonesPage();}
  else if(S.tab==="history"){h+=renderHistoryPage();}
  h+=renderDayModal();h+=renderCtxMenu();h+=renderConfirmModal();h+=renderTimerConfirm();h+=renderStatusModal();h+=renderCallRef();h+=renderNav();
  document.getElementById("app").innerHTML=h;
  // Dot observers
  document.querySelectorAll(".s-card-scroll").forEach(sc=>{const dots=sc.closest(".s-card")?.querySelector(".dots");if(!dots)return;const spans=dots.querySelectorAll("span");sc.addEventListener("scroll",()=>{const i=Math.round(sc.scrollLeft/sc.offsetWidth);spans.forEach((s,j)=>s.className=j===i?"active":"");},{passive:true});});
}
render();syncFromSheet();if(S.pendingWrites.length>0)flushPending();
setInterval(()=>{if(S.nurseTimer){const e=document.getElementById("timer-display");if(e)e.textContent=getTimerElapsed();}},1000);
setInterval(()=>{const c=document.querySelector(".feed-timer");if(c){const f=getLastFeedInfo(),d=getLastDiaperInfo();const items=c.querySelectorAll(".ft-item");if(items[0]&&d)items[0].innerHTML=`<div>${d.emoji} <span class="ft-time">${d.time}</span></div><div class="ft-label">${d.label}</div>`;if(items[1]&&f){items[1].className="ft-item "+(f.cls||"");items[1].innerHTML=`<div>${f.emoji} <span class="ft-time">${f.time}</span></div><div class="ft-label">${f.label}</div>`;}}},6e4);
</script>
</body>
</html>
