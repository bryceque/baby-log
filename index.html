<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Activity Log">
<meta name="theme-color" content="#1a1a2e">
<title>Activity Log</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1a2e;--surface:#222244;--surfaceAlt:#2a2a4e;
  --text:#e8e6f0;--muted:#9896a8;
  --diaper:#f4a261;--diaperBg:#3d2e1a;
  --breast:#a78bfa;--breastBg:#2a2240;
  --bottle:#60c5f1;--bottleBg:#1a2e3d;
  --formula:#60c5f1;--breastmilk:#f9a8d4;--breastmilkBg:#3d1a2e;
  --poop:#c47f3c;--pee:#f0d56e;
  --danger:#e74c5f;--success:#4ade80;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 16px 100px;max-width:480px;margin:0 auto;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input[type=number],input[type=datetime-local]{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

.header{text-align:center;padding:16px 0 12px}
.header h1{font-size:24px;font-weight:800}
.header .baby-name{font-size:14px;color:var(--breast);margin-top:2px;font-weight:500;letter-spacing:.3px}
.header .date{font-size:13px;color:var(--muted);margin-top:4px}
.sync-badge{font-size:11px;color:var(--muted);background:var(--surfaceAlt);padding:3px 10px;border-radius:8px;display:inline-block;margin-top:6px}
.sync-badge.active{color:var(--diaper)}

.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 4px;margin-bottom:4px}
.summary-card{padding:10px 8px;border-radius:12px;text-align:center}
.summary-card .num{font-size:20px;font-weight:700}
.summary-card .label{font-size:11px;color:var(--muted);margin-top:1px}
.summary-card .sub{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}

.actions{display:flex;gap:8px;justify-content:center;margin:16px 0}
.action-btn{flex:1;padding:16px 8px;border-radius:16px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.action-btn .icon{font-size:28px}

.form-card{margin:16px 0;padding:20px;border-radius:20px;background:var(--surface)}
.form-header{display:flex;align-items:center;margin-bottom:16px}
.back-btn{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:4px;padding:4px 0}
.form-title{flex:1;text-align:center;font-size:16px;font-weight:700;margin-right:48px}
.form-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}

.pill{padding:10px 20px;border-radius:24px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;border:2px solid transparent}
.pill.active{border-color:currentColor}

.stepper{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surfaceAlt);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center}
.stepper input{width:64px;text-align:center;padding:8px 4px;border-radius:12px;background:var(--surface);color:var(--text);font-size:20px;font-weight:700;border:2px solid var(--surfaceAlt)}
.stepper .unit{color:var(--muted);font-size:14px}

.quick-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.quick-btn{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;background:var(--surfaceAlt);color:var(--muted)}

.time-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px}
.time-row input{padding:8px 12px;border-radius:12px;border:1px solid var(--surfaceAlt);background:var(--surface);color:var(--text);font-size:14px}

.btn-row{display:flex;gap:10px;justify-content:center}
.cancel-btn{padding:12px 24px;border-radius:14px;background:var(--surfaceAlt);color:var(--muted);font-size:15px}
.save-btn{padding:12px 32px;border-radius:14px;font-size:15px;font-weight:700}
.save-btn:disabled{background:var(--surfaceAlt);color:var(--muted)}

.history-header{margin:16px 0 10px 4px;font-size:15px;font-weight:700;color:var(--muted)}
.log-entry{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:6px;border-left:3px solid}
.log-entry .info{flex:1}
.log-entry .summary-text{font-size:15px;font-weight:500}
.log-entry .time-text{font-size:12px;color:var(--muted);margin-top:3px}
.log-entry .sheet-badge{font-size:10px;margin-left:6px}
.delete-btn{width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.show-more{display:block;margin:12px auto;padding:10px 24px;border-radius:12px;background:var(--surfaceAlt);color:var(--muted);font-size:14px;font-weight:600}
</style>
</head>
<body>

<div id="app"></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyKhhzpzd7kcYYuWquEimol3DFPIiav44dwwH0RREujfyOO9-QWLGm6dIr84FjByrC6/exec";

const S={
  logs:JSON.parse(localStorage.getItem("bl-logs")||"[]"),
  form:null,syncing:false,confirmDel:null,
  showCount:5,
  pendingWrites:JSON.parse(localStorage.getItem("bl-pending")||"[]")
};

function save(){localStorage.setItem("bl-logs",JSON.stringify(S.logs))}
function savePending(){localStorage.setItem("bl-pending",JSON.stringify(S.pendingWrites))}
function toDate(d){return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`}
function toTime(d){const h=d.getHours(),m=d.getMinutes().toString().padStart(2,"0");return `${h%12||12}:${m} ${h>=12?"PM":"AM"}`}
function toISO(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}

function timeSince(ds,ts){
  if(!ts||!ds)return "";
  try{
    const tp=ts.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return "";
    let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();
    if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;
    const dp=ds.split("/");if(dp.length!==3)return "";
    const d=new Date(+dp[2],+dp[0]-1,+dp[1],h,m);if(isNaN(d))return "";
    const mins=Math.floor((Date.now()-d)/60000);
    if(mins<0)return "";if(mins<1)return "just now";if(mins<60)return mins+"m ago";
    const hrs=Math.floor(mins/60);
    if(hrs<24)return hrs+"h "+(mins%60)+"m ago";return Math.floor(hrs/24)+"d ago";
  }catch{return "";}
}

function shortTime(ds,ts){
  if(!ts||!ds)return "";
  return ts+" · "+timeSince(ds,ts);
}

function classify(e){
  if(e.pee||e.poop)return "diaper";
  if(e.breastLength)return "breast";
  if(e.formulaAmount)return "formula";
  if(e.breastMilkAmount)return "breastmilk";
  return "other";
}

function parseEntryDate(e){
  if(!e.date||!e.time)return 0;
  try{
    const tp=e.time.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!tp)return 0;
    let h=+tp[1];const m=+tp[2],ap=(tp[3]||"").toUpperCase();
    if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;
    const dp=e.date.split("/");if(dp.length!==3)return 0;
    return new Date(+dp[2],+dp[0]-1,+dp[1],h,m).getTime();
  }catch{return 0;}
}

function sortLogs(){S.logs.sort((a,b)=>parseEntryDate(b)-parseEntryDate(a));}

async function syncFromSheet(){
  S.syncing=true;render();
  try{
    const r=await fetch(SCRIPT_URL);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();
    const entries=data.map(row=>{
      const e={
        date:row["Today's Date"]||"",time:row["Time of Day"]||"",
        breastLength:row["Length of Breast Feeding"]||"",
        formulaAmount:row["Formula Amount"]||"",breastMilkAmount:row["Breast Milk Amount"]||"",
        side:row["Right Side/Left Side"]||"",pee:row["Pee"]||"",poop:row["Poop"]||"",
        fromSheet:true,id:"s-"+Math.random().toString(36).slice(2,8)
      };
      if(e.date.includes("1899"))e.date="";
      if(e.time.includes("1899"))e.time="";
      e.displayType=classify(e);
      return e;
    }).filter(e=>e.date||e.time);
    const local=S.logs.filter(l=>!l.fromSheet);
    S.logs=[...local,...entries];
    sortLogs();save();
  }catch(e){console.error("Sync error:",e);}
  S.syncing=false;render();
}

async function writeToSheet(entry){
  S.pendingWrites.push(entry);savePending();render();
  flushPending();
}

async function flushPending(){
  while(S.pendingWrites.length>0){
    const entry=S.pendingWrites[0];
    try{
      const p=new URLSearchParams({
        action:"add",date:entry.date||"",timeOfDay:entry.time||"",
        breastLength:entry.breastLength||"",formulaAmount:entry.formulaAmount||"",
        breastMilkAmount:entry.breastMilkAmount||"",side:entry.side||"",
        pee:entry.pee||"",poop:entry.poop||""
      });
      const r=await fetch(SCRIPT_URL+"?"+p.toString());
      if(r.ok){S.pendingWrites.shift();savePending();render();}
      else break;
    }catch(e){console.error("Write error:",e);break;}
  }
}

function addEntry(entry){
  entry.displayType=classify(entry);
  entry.id=Date.now().toString();
  S.logs.unshift(entry);
  sortLogs();save();S.form=null;render();
  writeToSheet(entry);
}

function deleteEntry(id){
  S.logs=S.logs.filter(l=>l.id!==id);save();S.confirmDel=null;render();
}

function renderSummary(){
  const today=toDate(new Date());
  const all=S.logs;
  const t=all.filter(l=>l.date===today);

  // DIAPER: count today, show last pee and last poop with emoji + time
  const diapers=t.filter(l=>l.displayType==="diaper").length;
  const lastPee=all.filter(l=>l.pee).sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  const lastPoop=all.filter(l=>l.poop).sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  let diaperSub="";
  if(lastPee)diaperSub+=`💧 ${shortTime(lastPee.date,lastPee.time)}`;
  if(lastPee&&lastPoop)diaperSub+=`<br>`;
  if(lastPoop)diaperSub+=`💩 ${shortTime(lastPoop.date,lastPoop.time)}`;

  // NURSE: show last side as big text, last nursing time as sub
  const lastNurse=all.filter(l=>l.displayType==="breast").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  const nurseBig=lastNurse?(lastNurse.side||"?"):"—";
  let nurseSub="";
  if(lastNurse)nurseSub=`${lastNurse.breastLength}<br>${shortTime(lastNurse.date,lastNurse.time)}`;

  // BOTTLE: today's total mL as big, last feed amount + time as sub
  const todayBottle=t.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk");
  const totalMl=todayBottle.reduce((s,l)=>{
    const m=(l.formulaAmount||l.breastMilkAmount||"").match(/(\d+)/);
    return s+(m?+m[1]:0);
  },0);
  const lastBottle=all.filter(l=>l.displayType==="formula"||l.displayType==="breastmilk").sort((a,b)=>parseEntryDate(b)-parseEntryDate(a))[0];
  let bottleSub="";
  if(lastBottle){
    const amt=lastBottle.formulaAmount||lastBottle.breastMilkAmount||"";
    bottleSub=`Last: ${amt}<br>${shortTime(lastBottle.date,lastBottle.time)}`;
  }

  return `<div class="summary">
    <div class="summary-card" style="background:var(--diaperBg)"><div class="num" style="color:var(--diaper)">${diapers}</div><div class="label">diapers today</div>${diaperSub?`<div class="sub">${diaperSub}</div>`:""}</div>
    <div class="summary-card" style="background:var(--breastBg)"><div class="num" style="color:var(--breast)">${nurseBig}</div><div class="label">last side</div>${nurseSub?`<div class="sub">${nurseSub}</div>`:""}</div>
    <div class="summary-card" style="background:var(--bottleBg)"><div class="num" style="color:var(--bottle)">${totalMl}<span style="font-size:12px"> mL</span></div><div class="label">today</div>${bottleSub?`<div class="sub">${bottleSub}</div>`:""}</div>
  </div>`;
}

function renderEntry(e){
  const cm={diaper:{a:"var(--diaper)",b:"var(--diaperBg)"},breast:{a:"var(--breast)",b:"var(--breastBg)"},formula:{a:"var(--bottle)",b:"var(--bottleBg)"},breastmilk:{a:"var(--breastmilk)",b:"var(--breastmilkBg)"},other:{a:"var(--muted)",b:"var(--surfaceAlt)"}};
  const c=cm[e.displayType]||cm.other;
  let sum="";
  if(e.displayType==="diaper"){const p=[];if(e.pee)p.push("💧 Pee");if(e.poop)p.push("💩 Poop");sum=p.join("  +  ");}
  else if(e.displayType==="breast")sum=`🤱 ${e.side||"?"} · ${e.breastLength}`;
  else if(e.displayType==="formula")sum=`🍼 Formula · ${e.formulaAmount}`;
  else if(e.displayType==="breastmilk")sum=`🍼 Breast Milk · ${e.breastMilkAmount}`;
  else sum=`📝 Feeding`;
  const since=timeSince(e.date,e.time);
  const badge=e.fromSheet?'<span class="sheet-badge">📊</span>':"";
  const del=e.fromSheet?"":`<button class="delete-btn" onclick="handleDel('${e.id}')">✕</button>`;
  return `<div class="log-entry" style="background:${c.b};border-color:${c.a}"><div class="info"><div class="summary-text">${sum}${badge}</div><div class="time-text">${e.date} ${e.time}${since?" · "+since:""}</div></div>${del}</div>`;
}

function renderForm(){
  const now=new Date();const iso=toISO(now);
  if(S.form==="diaper")return `<div class="form-card" style="border:1px solid rgba(244,162,97,.2)">
    <div class="form-header"><button class="back-btn" onclick="S.form=null;render()"><span style="font-size:18px">‹</span> Back</button><div class="form-title" style="color:var(--diaper)">🧷 Diaper</div></div>
    <div class="form-row"><button class="pill" id="pee-btn" onclick="togglePill('pee')" style="background:var(--surfaceAlt);color:var(--muted)">💧 Pee</button><button class="pill" id="poop-btn" onclick="togglePill('poop')" style="background:var(--surfaceAlt);color:var(--muted)">💩 Poop</button></div>
    <div class="time-row">🕐 <input type="datetime-local" id="f-time" value="${iso}"></div>
    <div class="btn-row"><button class="cancel-btn" onclick="S.form=null;render()">Cancel</button><button class="save-btn" style="background:var(--diaper);color:#1a1a2e" onclick="saveDiaper()">Save</button></div></div>`;
  if(S.form==="breast")return `<div class="form-card" style="border:1px solid rgba(167,139,250,.2)">
    <div class="form-header"><button class="back-btn" onclick="S.form=null;render()"><span style="font-size:18px">‹</span> Back</button><div class="form-title" style="color:var(--breast)">🤱 Breastfeed</div></div>
    <div class="form-row"><button class="pill active" id="left-btn" onclick="pickSide('Left')" style="color:var(--breast);border-color:var(--breast);background:rgba(167,139,250,.13)">◀ Left</button><button class="pill" id="both-btn" onclick="pickSide('Both')" style="background:var(--surfaceAlt);color:var(--muted)">Both</button><button class="pill" id="right-btn" onclick="pickSide('Right')" style="background:var(--surfaceAlt);color:var(--muted)">▶ Right</button></div>
    <div class="stepper"><button onclick="stepMin(-1)">−</button><input type="number" id="f-mins" value="15"><span class="unit">min</span><button onclick="stepMin(1)">+</button></div>
    <div class="quick-btns"><button class="quick-btn" onclick="setMin(5)">5 min</button><button class="quick-btn" onclick="setMin(15)">15 min</button><button class="quick-btn" onclick="setMin(20)">20 min</button></div>
    <div class="time-row">🕐 <input type="datetime-local" id="f-time" value="${iso}"></div>
    <div class="btn-row"><button class="cancel-btn" onclick="S.form=null;render()">Cancel</button><button class="save-btn" style="background:var(--breast);color:#1a1a2e" onclick="saveBreast()">Save</button></div></div>`;
  if(S.form==="bottle")return `<div class="form-card" style="border:1px solid rgba(96,197,241,.2)">
    <div class="form-header"><button class="back-btn" onclick="S.form=null;render()"><span style="font-size:18px">‹</span> Back</button><div class="form-title" style="color:var(--bottle)">🍼 Bottle</div></div>
    <div class="form-row"><button class="pill active" id="bm-btn" onclick="pickBottle('breastmilk')" style="color:var(--breastmilk);border-color:var(--breastmilk);background:rgba(249,168,212,.13)">Breast Milk</button><button class="pill" id="formula-btn" onclick="pickBottle('formula')" style="background:var(--surfaceAlt);color:var(--muted)">Formula</button></div>
    <div class="stepper"><button onclick="stepMl(-1)">−</button><input type="number" id="f-ml" value="4"><span class="unit">mL</span><button onclick="stepMl(1)">+</button></div>
    <div class="quick-btns"><button class="quick-btn" onclick="setMl(3)">3mL</button><button class="quick-btn" onclick="setMl(5)">5mL</button><button class="quick-btn" onclick="setMl(6)">6mL</button></div>
    <div class="time-row">🕐 <input type="datetime-local" id="f-time" value="${iso}"></div>
    <div class="btn-row"><button class="cancel-btn" onclick="S.form=null;render()">Cancel</button><button class="save-btn" id="bottle-save" style="background:var(--breastmilk);color:#1a1a2e" onclick="saveBottle()">Save</button></div></div>`;
  return "";
}

function render(){
  const app=document.getElementById("app");
  const syncStatus=S.syncing?"Syncing...":S.pendingWrites.length>0?`${S.pendingWrites.length} pending upload`:"Synced with Sheet";
  let h=`<div class="header"><h1>Activity Log 👶</h1><div class="baby-name">Alaiya Maeve Querubin</div><div class="date">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
    <span class="sync-badge ${S.syncing?"active":""}">${S.syncing?"⟳ ":"📊 "}${syncStatus}</span></div>`;

  if(S.logs.length>0)h+=renderSummary();
  
  if(!S.form){
    h+=`<div class="actions">
      <button class="action-btn" style="border:2px solid rgba(244,162,97,.2);background:var(--diaperBg);color:var(--diaper)" onclick="S.form='diaper';render()"><span class="icon">🧷</span>Diaper</button>
      <button class="action-btn" style="border:2px solid rgba(167,139,250,.2);background:var(--breastBg);color:var(--breast)" onclick="S.form='breast';render()"><span class="icon">🤱</span>Nurse</button>
      <button class="action-btn" style="border:2px solid rgba(96,197,241,.2);background:var(--bottleBg);color:var(--bottle)" onclick="S.form='bottle';render()"><span class="icon">🍼</span>Bottle</button>
    </div>`;
  }else{h+=renderForm();}
  
  h+=`<div class="history-header">History (${S.logs.length})</div>`;
  if(S.logs.length===0&&!S.syncing)h+=`<div class="empty">No logs yet — tap a button above to start</div>`;
  else{
    const visible=S.logs.slice(0,S.showCount);
    visible.forEach(e=>{h+=renderEntry(e);});
    if(S.logs.length>S.showCount){
      const remaining=S.logs.length-S.showCount;
      h+=`<button class="show-more" onclick="showMore()">Show more (${remaining} older)</button>`;
    }
  }
  app.innerHTML=h;
}

let formPee=false,formPoop=false,formSide="Left",formBottleType="breastmilk";

function togglePill(type){
  if(type==="pee"){formPee=!formPee;const b=document.getElementById("pee-btn");b.style.background=formPee?"rgba(240,213,110,.13)":"var(--surfaceAlt)";b.style.color=formPee?"var(--pee)":"var(--muted)";b.style.borderColor=formPee?"var(--pee)":"transparent";b.className=formPee?"pill active":"pill";}
  if(type==="poop"){formPoop=!formPoop;const b=document.getElementById("poop-btn");b.style.background=formPoop?"rgba(196,127,60,.13)":"var(--surfaceAlt)";b.style.color=formPoop?"var(--poop)":"var(--muted)";b.style.borderColor=formPoop?"var(--poop)":"transparent";b.className=formPoop?"pill active":"pill";}
}
function pickSide(s){
  formSide=s;
  const lb=document.getElementById("left-btn"),rb=document.getElementById("right-btn"),bb=document.getElementById("both-btn");
  [lb,rb,bb].forEach(b=>{b.className="pill";b.style.color="var(--muted)";b.style.borderColor="transparent";b.style.background="var(--surfaceAlt)";});
  const active=s==="Left"?lb:s==="Right"?rb:bb;
  active.className="pill active";active.style.color="var(--breast)";active.style.borderColor="var(--breast)";active.style.background="rgba(167,139,250,.13)";
}
function pickBottle(t){
  formBottleType=t;
  const fb=document.getElementById("formula-btn"),bb=document.getElementById("bm-btn"),sv=document.getElementById("bottle-save");
  fb.className=t==="formula"?"pill active":"pill";fb.style.color=t==="formula"?"var(--formula)":"var(--muted)";fb.style.borderColor=t==="formula"?"var(--formula)":"transparent";fb.style.background=t==="formula"?"rgba(96,197,241,.13)":"var(--surfaceAlt)";
  bb.className=t==="breastmilk"?"pill active":"pill";bb.style.color=t==="breastmilk"?"var(--breastmilk)":"var(--muted)";bb.style.borderColor=t==="breastmilk"?"rgba(249,168,212,1)":"transparent";bb.style.background=t==="breastmilk"?"rgba(249,168,212,.13)":"var(--surfaceAlt)";
  sv.style.background=t==="formula"?"var(--formula)":"var(--breastmilk)";
}
function stepMin(d){const i=document.getElementById("f-mins");i.value=Math.max(1,Math.min(120,(+i.value||0)+d));}
function stepMl(d){const i=document.getElementById("f-ml");i.value=Math.max(1,Math.min(500,(+i.value||0)+d));}
function setMl(v){document.getElementById("f-ml").value=v;}
function setMin(v){document.getElementById("f-mins").value=v;}
function showMore(){S.showCount+=10;render();}

function saveDiaper(){
  if(!formPee&&!formPoop)return;
  const d=new Date(document.getElementById("f-time").value);
  addEntry({date:toDate(d),time:toTime(d),pee:formPee?"X":"",poop:formPoop?"X":""});
  formPee=false;formPoop=false;
}
function saveBreast(){
  const mins=document.getElementById("f-mins").value;
  const d=new Date(document.getElementById("f-time").value);
  addEntry({date:toDate(d),time:toTime(d),breastLength:mins+" min",side:formSide});
  formSide="Left";
}
function saveBottle(){
  const ml=document.getElementById("f-ml").value;
  const d=new Date(document.getElementById("f-time").value);
  addEntry({date:toDate(d),time:toTime(d),formulaAmount:formBottleType==="formula"?ml+" mL":"",breastMilkAmount:formBottleType==="breastmilk"?ml+" mL":""});
  formBottleType="breastmilk";
}

function handleDel(id){
  if(S.confirmDel===id){deleteEntry(id);}
  else{S.confirmDel=id;render();setTimeout(()=>{if(S.confirmDel===id){S.confirmDel=null;render();}},3000);}
}

render();
syncFromSheet();
if(S.pendingWrites.length>0)flushPending();
</script>
</body>
</html>
